function setArmFocus(playerId, opts = {}) {
  if (!playerId) return;
  if (opts.soft && armState.lockedFocus) return;
  const exists = armState.filtered.some(p => p.id === playerId);
  if (!exists) return;
  armState.focusedId = playerId;
  if (opts.locked) armState.lockedFocus = true;
  updateArmFocusPanel();
  armState.nodesDirty = true;
  positionArmNodes(performance.now());
}

function updateArmFocusPanel() {
  armFocusPanel.innerHTML = '';
}

function getArmAvatarOrigin(sourceNode, event) {
  const avatar = event?.target?.closest?.('.arm-node-photo-wrap') ||
    sourceNode?.querySelector?.('.arm-node-photo-wrap') ||
    sourceNode;
  const rect = avatar?.getBoundingClientRect?.();
  if (rect && rect.width && rect.height) {
    return { cx: rect.left + rect.width / 2, cy: rect.top + rect.height / 2 };
  }
  if (event && Number.isFinite(event.clientX) && Number.isFinite(event.clientY)) {
    return { cx: event.clientX, cy: event.clientY };
  }
  return { cx: window.innerWidth / 2, cy: window.innerHeight / 2 };
}

function openArmCardModal(player, origin) {
  if (!player || !armCardModal || !armCardMount) return;
  const cx = Number.isFinite(origin?.cx) ? origin.cx : window.innerWidth / 2;
  const cy = Number.isFinite(origin?.cy) ? origin.cy : window.innerHeight / 2;
  armCardModal.style.setProperty('--origin-x', `${cx}px`);
  armCardModal.style.setProperty('--origin-y', `${cy}px`);
  armCardModal.style.setProperty('--origin-dx', `${cx - window.innerWidth / 2}px`);
  armCardModal.style.setProperty('--origin-dy', `${cy - window.innerHeight / 2}px`);
  armCardMount.innerHTML = renderPlayerCardV2(player);
  armCardModal.setAttribute('aria-hidden', 'false');
  document.body.classList.add('arm-card-open');
  requestAnimationFrame(() => armCardModal.classList.add('is-open'));
}

function closeArmCardModal() {
  if (!armCardModal || !armCardModal.classList.contains('is-open')) return;
  armCardModal.classList.remove('is-open');
  armCardModal.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('arm-card-open');
  armState.lockedFocus = false;
  armState.focusedId = null;
  armState.nodesDirty = true;
  positionArmNodes(performance.now());
  window.setTimeout(() => {
    if (!armCardModal.classList.contains('is-open')) armCardMount.innerHTML = '';
  }, 340);
}

function renderArm(filtered) {
  armState.filtered = filtered.slice();
  armState.staticRendered = false;
  armState.nodesDirty = true;
  armState.layoutKey = '';
  armState.layoutPoints = [];
  armStage.classList.toggle('is-empty', filtered.length === 0);
  armStage.dataset.density = filtered.length > 120 ? 'overflow' : filtered.length > 84 ? 'dense' : 'normal';
  armCountLabel.textContent = `${filtered.length} / ${players.length} PLAYERS`;
  armModeLabel.textContent = `${activeFilter.pos === '全部' ? 'ALL POSITIONS' : activeFilter.pos} · ${armState.totalGames} GAMES`;
  if (!filtered.length) {
    armNodeLayer.innerHTML = '';
    armState.nodeEls = [];
    armFocusPanel.innerHTML = '';
    return;
  }
  renderArmNodes(filtered);
  const currentStillVisible = filtered.some(p => p.id === armState.focusedId);
  if (!currentStillVisible) {
    armState.focusedId = null;
    armState.lockedFocus = false;
  }
  updateArmFocusPanel();
  startArmAnimation();
  positionArmNodes(performance.now());
  scheduleArmScene();
}

function getArmStageBounds(rect) {
  const w = rect.width || window.innerWidth;
  const h = rect.height || 760;
  const mobile = w < 720;
  if (isWallpaperMode) {
    const sidePad = mobile ? 34 : clamp(w * .055, 58, 120);
    const topPad = mobile ? clamp(h * .18, 138, 210) : clamp(h * .19, 156, 228);
    const bottomPad = mobile ? clamp(h * .12, 78, 124) : clamp(h * .10, 78, 118);
    const areaW = Math.max(1, w - sidePad * 2);
    const areaH = Math.max(1, h - topPad - bottomPad);
    const centerX = sidePad + areaW * .5;
    const centerY = topPad + areaH * .5;
    return { w, h, mobile, sidePad, topPad, bottomPad, areaW, areaH, centerX, centerY };
  }
  const sidePad = mobile ? 42 : 76;
  const topPad = mobile ? 304 : 238;
  const bottomPad = mobile ? clamp(h * .22, 176, 232) : 112;
  const areaW = Math.max(1, w - sidePad * 2);
  const areaH = Math.max(1, h - topPad - bottomPad);
  const centerX = sidePad + areaW * .5;
  const centerY = topPad + areaH * .5;
  return { w, h, mobile, sidePad, topPad, bottomPad, areaW, areaH, centerX, centerY };
}

function buildArmYearSegments(value) {
  const digits = normalizeArmYear(value).split('');
  const gap = .62;
  const segmentLines = {
    a: [[.18, 0], [.82, 0]],
    b: [[1, .12], [1, .88]],
    c: [[1, 1.12], [1, 1.88]],
    d: [[.18, 2], [.82, 2]],
    e: [[0, 1.12], [0, 1.88]],
    f: [[0, .12], [0, .88]],
    g: [[.18, 1], [.82, 1]],
  };
  const digitMap = {
    0: ['a', 'b', 'c', 'd', 'e', 'f'],
    1: ['b', 'c'],
    2: ['a', 'b', 'g', 'e', 'd'],
    3: ['a', 'b', 'g', 'c', 'd'],
    4: ['f', 'g', 'b', 'c'],
    5: ['a', 'f', 'g', 'c', 'd'],
    6: ['a', 'f', 'g', 'e', 'c', 'd'],
    7: ['a', 'b', 'c'],
    8: ['a', 'b', 'c', 'd', 'e', 'f', 'g'],
    9: ['a', 'b', 'c', 'd', 'f', 'g'],
  };
  const segments = [];
  digits.forEach((digit, digitIndex) => {
    const offsetX = digitIndex * (1 + gap);
    (digitMap[digit] || digitMap[0]).forEach(key => {
      const line = segmentLines[key];
      const x1 = line[0][0] + offsetX;
      const y1 = line[0][1];
      const x2 = line[1][0] + offsetX;
      const y2 = line[1][1];
      segments.push({ x1, y1, x2, y2, length: Math.hypot(x2 - x1, y2 - y1) });
    });
  });
  return {
    segments,
    width: Math.max(1, digits.length + Math.max(0, digits.length - 1) * gap),
  };
}

function armPlayerMatchesTokens(player, tokens) {
  if (!player || !tokens?.length) return false;
  const rawValues = [player.id, player.name, ...(Array.isArray(player.aliases) ? player.aliases : [])]
    .map(value => String(value || '').trim())
    .filter(Boolean);
  const rawSet = new Set(rawValues.map(value => value.toLowerCase()));
  const keySet = new Set(rawValues.map(value => DB.canonicalNameKey(value)));
  return tokens.some(token => {
    const raw = String(token || '').trim();
    if (!raw) return false;
    return rawSet.has(raw.toLowerCase()) || keySet.has(DB.canonicalNameKey(raw));
  });
}

function findArmLockedPlayerIndex(tokens) {
  return armState.filtered.findIndex(player => armPlayerMatchesTokens(player, tokens));
}

function keepArmLockedPlayerPairsTogether(points, bounds, minDist) {
  if (!points.length || !ARM_LOCKED_PLAYER_PAIRS.length) return;
  const { mobile, sidePad, topPad, bottomPad, w, h, centerX, centerY } = bounds;
  const radius = clamp(minDist * 1.08, mobile ? 58 : 82, mobile ? 82 : 112);
  const maxX = Math.max(sidePad, w - sidePad);
  const maxY = Math.max(topPad, h - bottomPad);

  ARM_LOCKED_PLAYER_PAIRS.forEach(pair => {
    const anchorIndex = findArmLockedPlayerIndex(pair.anchor);
    const followIndex = findArmLockedPlayerIndex(pair.follow);
    if (anchorIndex < 0 || followIndex < 0 || anchorIndex === followIndex) return;
    const anchor = points[anchorIndex];
    const follower = points[followIndex];
    if (!anchor || !follower) return;

    let best = null;
    const baseAngle = Number.isFinite(anchor.theta) ? anchor.theta : -Math.PI / 4;
    for (let step = 0; step < 18; step++) {
      const theta = baseAngle + step * Math.PI * 2 / 18;
      const x = clamp(anchor.x + Math.cos(theta) * radius, sidePad, maxX);
      const y = clamp(anchor.y + Math.sin(theta) * radius, topPad, maxY);
      const pairDistance = Math.hypot(x - anchor.x, y - anchor.y);
      if (pairDistance < radius * .72) continue;
      let nearest = Infinity;
      for (let i = 0; i < points.length; i++) {
        if (i === anchorIndex || i === followIndex || !points[i]) continue;
        nearest = Math.min(nearest, Math.hypot(x - points[i].x, y - points[i].y));
      }
      const edgePenalty = Math.min(x - sidePad, maxX - x, y - topPad, maxY - y);
      const score = nearest + edgePenalty * .18 + pairDistance * .28;
      if (!best || score > best.score) best = { x, y, theta, score };
    }
    if (!best) {
      const theta = Math.atan2(centerY - anchor.y, centerX - anchor.x);
      best = {
        x: clamp(anchor.x + Math.cos(theta) * radius, sidePad, maxX),
        y: clamp(anchor.y + Math.sin(theta) * radius, topPad, maxY),
        theta,
      };
    }
    if (!best) return;
    follower.x = best.x;
    follower.y = best.y;
    follower.theta = best.theta;
    follower.ring = anchor.ring;
  });
}

function buildArmLayout(count, rect) {
  const bounds = getArmStageBounds(rect);
  const { w, h, mobile, sidePad, topPad, bottomPad, areaW, areaH, centerX, centerY } = bounds;
  const golden = 2.399963229728653;
  const spread = armAdminState.spread || 1;
  const seedBase = Number(armAdminState.randomSeed || 1);
  const mode = armAdminState.formation || 'scatter';
  const densityDist = Math.sqrt((areaW * areaH) / Math.max(count, 1)) * .72 * spread;
  const minDist = mode === 'year'
    ? clamp(densityDist * .58, mobile ? 34 : 44, mobile ? 50 : 62)
    : clamp(densityDist, mobile ? 54 : 76, mobile ? 68 : 92);
  const points = [];

  function jitter(seed, axis, amount) {
    return (armHash01((seed + seedBase) * axis) - .5) * amount;
  }
  function pushPoint(index, x, y, theta, ring) {
    const seed = index + 1 + seedBase * .013;
    points[index] = {
      x: clamp(x, sidePad, Math.max(sidePad, w - sidePad)),
      y: clamp(y, topPad, Math.max(topPad, h - bottomPad)),
      seed,
      theta,
      ring,
    };
  }

  if (mode === 'year') {
    const yearShape = buildArmYearSegments(armAdminState.year);
    const totalLen = yearShape.segments.reduce((sum, segment) => sum + segment.length, 0) || 1;
    const glyphLimit = Math.min(count, armAdminState.yearLimit || ARM_ADMIN_DEFAULTS.yearLimit);
    const glyphIndices = armState.filtered
      .map((player, index) => ({ index, score: armPlayerSortScore(player) }))
      .sort((a, b) => b.score - a.score || a.index - b.index)
      .slice(0, glyphLimit)
      .map(item => item.index);
    const glyphSet = new Set(glyphIndices);
    const scale = Math.min(
      areaW * (mobile ? .86 : .80) / yearShape.width,
      areaH * (mobile ? .46 : .58) / 2
    ) * spread;
    const originX = centerX - yearShape.width * scale * .5;
    const originY = centerY - scale;
    glyphIndices.forEach((index, order) => {
      const seed = index + 1;
      let cursor = ((order + .5) / Math.max(glyphIndices.length, 1)) * totalLen;
      let segment = yearShape.segments[yearShape.segments.length - 1];
      for (const candidate of yearShape.segments) {
        if (cursor <= candidate.length) {
          segment = candidate;
          break;
        }
        cursor -= candidate.length;
      }
      const p = clamp(cursor / Math.max(segment.length, .001), 0, 1);
      const localX = segment.x1 + (segment.x2 - segment.x1) * p;
      const localY = segment.y1 + (segment.y2 - segment.y1) * p;
      const theta = Math.atan2(segment.y2 - segment.y1, segment.x2 - segment.x1);
      pushPoint(
        index,
        originX + localX * scale + jitter(seed, 31, mobile ? 4 : 7),
        originY + localY * scale + jitter(seed, 47, mobile ? 4 : 7),
        theta,
        p
      );
    });
    const outer = [];
    for (let index = 0; index < count; index++) {
      if (!glyphSet.has(index)) outer.push(index);
    }
    outer.forEach((index, order) => {
      const seed = index + 1;
      const p = outer.length <= 1 ? .5 : order / (outer.length - 1);
      const ringIndex = order % (mobile ? 2 : 3);
      const ring = .72 + ringIndex * .12 + armHash01((seed + seedBase) * 19) * .05;
      const theta = p * Math.PI * 2 + ringIndex * .72 + armHash01((seed + seedBase) * 23) * .22;
      pushPoint(
        index,
        centerX + Math.cos(theta) * areaW * .48 * ring * spread + jitter(seed, 31, mobile ? 7 : 12),
        centerY + Math.sin(theta) * areaH * .42 * ring * spread + jitter(seed, 47, mobile ? 7 : 12),
        theta,
        ring
      );
    });
  } else if (mode === 'orion') {
    const samples = buildOrPathSamples(rect);
    for (let index = 0; index < count; index++) {
      const sample = samples[index % samples.length];
      const lap = Math.floor(index / Math.max(samples.length, 1));
      const seed = index + 1;
      const theta = (index / Math.max(count, 1)) * Math.PI * 2;
      pushPoint(
        index,
        sample.x + jitter(seed, 19, (mobile ? 18 : 30) * (lap + .8)),
        sample.y + jitter(seed, 23, (mobile ? 14 : 24) * (lap + .8)),
        theta,
        .45 + lap * .08
      );
    }
  } else if (mode === 'spiral') {
    for (let index = 0; index < count; index++) {
      const seed = index + 1;
      const p = count <= 1 ? 0 : index / (count - 1);
      const theta = seed * .72 + p * Math.PI * 5.2;
      const ring = Math.sqrt(p);
      pushPoint(
        index,
        centerX + Math.cos(theta) * areaW * .43 * ring * spread + jitter(seed, 31, mobile ? 10 : 18),
        centerY + Math.sin(theta) * areaH * .39 * ring * spread + jitter(seed, 47, mobile ? 9 : 15),
        theta,
        ring
      );
    }
  } else if (mode === 'orbit') {
    const rings = mobile ? 2 : 3;
    for (let index = 0; index < count; index++) {
      const seed = index + 1;
      const ringIndex = index % rings;
      const ring = (ringIndex + 1) / rings;
      const theta = (Math.PI * 2 * Math.floor(index / rings)) / Math.max(Math.ceil(count / rings), 1) + ringIndex * .58;
      pushPoint(
        index,
        centerX + Math.cos(theta) * areaW * (.17 + ring * .29) * spread + jitter(seed, 31, mobile ? 8 : 16),
        centerY + Math.sin(theta) * areaH * (.15 + ring * .28) * spread + jitter(seed, 47, mobile ? 8 : 14),
        theta,
        ring
      );
    }
  } else if (mode === 'diamond') {
    const home = { x: centerX, y: centerY + areaH * (mobile ? .30 : .31) };
    const first = { x: centerX + areaW * (mobile ? .30 : .24), y: centerY + areaH * (mobile ? .05 : .03) };
    const second = { x: centerX, y: centerY - areaH * (mobile ? .23 : .25) };
    const third = { x: centerX - areaW * (mobile ? .30 : .24), y: centerY + areaH * (mobile ? .05 : .03) };
    const segments = [
      [home, first],
      [first, second],
      [second, third],
      [third, home],
    ];
    const perimeterCount = Math.max(4, Math.ceil(count * .72));
    for (let index = 0; index < count; index++) {
      const seed = index + 1;
      if (index < perimeterCount) {
        const t = (index / perimeterCount) * segments.length;
        const segIndex = Math.min(segments.length - 1, Math.floor(t));
        const local = t - segIndex;
        const [a, b] = segments[segIndex];
        const x = a.x + (b.x - a.x) * local;
        const y = a.y + (b.y - a.y) * local;
        pushPoint(
          index,
          x + jitter(seed, 31, mobile ? 7 : 12),
          y + jitter(seed, 47, mobile ? 7 : 12),
          Math.atan2(b.y - a.y, b.x - a.x),
          local
        );
      } else {
        const order = index - perimeterCount;
        const outfieldCount = Math.max(1, count - perimeterCount);
        const p = (order + .5) / outfieldCount;
        const theta = Math.PI * (1.10 + p * .80);
        pushPoint(
          index,
          centerX + Math.cos(theta) * areaW * (mobile ? .42 : .44) * spread + jitter(seed, 31, mobile ? 8 : 14),
          centerY + areaH * .04 + Math.sin(theta) * areaH * (mobile ? .34 : .39) * spread + jitter(seed, 47, mobile ? 8 : 13),
          theta,
          p
        );
      }
    }
  } else if (mode === 'vline') {
    const rows = Math.ceil(count / 2);
    for (let index = 0; index < count; index++) {
      const seed = index + 1;
      const side = index % 2 === 0 ? -1 : 1;
      const row = Math.floor(index / 2);
      const p = rows <= 1 ? .5 : row / (rows - 1);
      const theta = Math.atan2(p - .5, side * .45);
      const wing = Math.abs(p - .5);
      pushPoint(
        index,
        centerX + side * areaW * (.08 + wing * .62) * spread + jitter(seed, 31, mobile ? 8 : 18),
        topPad + areaH * (.08 + p * .84) + jitter(seed, 47, mobile ? 8 : 16),
        theta,
        p
      );
    }
  } else {
    const randomMode = mode === 'random';
    for (let index = 0; index < count; index++) {
      const seed = index + 1;
      const ring = randomMode
        ? Math.sqrt(armHash01((seed + seedBase) * 7))
        : Math.sqrt((index + .5) / Math.max(count, 1));
      const theta = randomMode
        ? armHash01((seed + seedBase) * 13) * Math.PI * 2
        : seed * golden + (armHash01((seed + seedBase) * 11) - .5) * .78;
      const jitterX = jitter(seed, 31, mobile ? 18 : 42);
      const jitterY = jitter(seed, 47, mobile ? 16 : 34);
      let x = centerX + Math.cos(theta) * areaW * .47 * ring * spread + jitterX;
      let y = centerY + Math.sin(theta) * areaH * .47 * ring * spread + jitterY;
      pushPoint(index, x, y, theta, ring);
    }
  }

  const manyNodes = points.length > 120;
  const iterations = manyNodes
    ? (mode === 'year' ? (mobile ? 6 : 8) : (mobile ? 10 : 14))
    : mode === 'orion'
    ? (mobile ? 38 : 54)
    : mode === 'year'
      ? (mobile ? 22 : 30)
      : (mobile ? 72 : 96);
  for (let iter = 0; iter < iterations; iter++) {
    for (let i = 0; i < points.length; i++) {
      for (let j = i + 1; j < points.length; j++) {
        const a = points[i];
        const b = points[j];
        let dx = a.x - b.x;
        let dy = a.y - b.y;
        let dist = Math.hypot(dx, dy);
        if (dist < .001) {
          const angle = (armHash01((i + 1) * (j + 3)) * Math.PI * 2);
          dx = Math.cos(angle);
          dy = Math.sin(angle);
          dist = 1;
        }
        if (dist >= minDist) continue;
        const push = (minDist - dist) * (mode === 'orion' ? .28 : mode === 'year' ? .16 : .52);
        const nx = dx / dist;
        const ny = dy / dist;
        a.x += nx * push;
        a.y += ny * push;
        b.x -= nx * push;
        b.y -= ny * push;
      }
    }
    for (const point of points) {
      point.x = clamp(point.x, sidePad, Math.max(sidePad, w - sidePad));
      point.y = clamp(point.y, topPad, Math.max(topPad, h - bottomPad));
    }
  }

  keepArmLockedPlayerPairsTogether(points, bounds, minDist);

  return points.map(point => {
    const norm = Math.hypot(
      (point.x - centerX) / Math.max(areaW * .52, 1),
      (point.y - centerY) / Math.max(areaH * .52, 1)
    );
    const depth = clamp(.44 + (1 - norm) * .30 + (armHash01(point.seed * 73) - .5) * .22, .26, .96);
    return { ...point, depth };
  });
}

function getArmLayout(count, rect) {
  const w = Math.round(rect.width || window.innerWidth);
  const h = Math.round(rect.height || 760);
  const ids = armState.filtered.map(p => p.id).join('|');
  const key = `${w}x${h}:${ids}:${armAdminState.formation}:${normalizeArmYear(armAdminState.year)}:${armAdminState.spread.toFixed(3)}:${armAdminState.randomSeed}`;
  if (armState.layoutKey !== key || armState.layoutPoints.length !== count) {
    armState.layoutKey = key;
    armState.layoutPoints = buildArmLayout(count, rect);
  }
  return armState.layoutPoints;
}

function getArmNodePoint(index, count, rect, layout, bounds) {
  const w = rect.width || window.innerWidth;
  const h = rect.height || 760;
  const { mobile, sidePad, topPad, bottomPad } = bounds;
  const base = layout[index];
  if (!base) return { x: w / 2, y: h / 2, depth: .5, u: 0, theta: 0 };
  const seed = base.seed;
  const drift = armState.phase * Math.PI * 2;
  const animateNodeField = false;
  const breatheX = animateNodeField ? Math.sin(drift * .92 + seed * 1.73) * (mobile ? 6 : 13) : 0;
  const breatheY = animateNodeField ? Math.cos(drift * .78 + seed * 1.37) * (mobile ? 5 : 10) : 0;
  const depthWave = animateNodeField ? Math.sin(base.theta + drift * .42) * .06 : 0;
  let x = base.x + breatheX;
  let y = base.y + breatheY;
  const depth = clamp(base.depth + depthWave, 0, 1);
  const u = ((index + .5) / Math.max(count, 1) + armState.phase * .05) % 1;
  x = clamp(x, sidePad, Math.max(sidePad, w - sidePad));
  y = clamp(y, topPad, Math.max(topPad, h - bottomPad));
  return { x, y, depth, u, theta: base.theta };
}

function buildOrPathSamples(rect) {
  const bounds = getArmStageBounds(rect);
  const { mobile, areaW, areaH, centerX } = bounds;
  const centerY = bounds.topPad + areaH * .54;
  const letterH = Math.min(areaH * (mobile ? .54 : .68), mobile ? 320 : 430);
  const oRx = letterH * .20;
  const oRy = letterH * .34;
  const oCx = centerX - areaW * (mobile ? .18 : .15);
  const oCy = centerY;
  const rCx = centerX + areaW * (mobile ? .13 : .13);
  const rStemX = rCx - letterH * .18;
  const rTop = centerY - letterH * .34;
  const rMid = centerY - letterH * .02;
  const rBottom = centerY + letterH * .34;
  const rBowlRx = letterH * .22;
  const rBowlRy = letterH * .16;
  const samples = [];

  for (let i = 0; i < 18; i++) {
    const t = -Math.PI / 2 + (Math.PI * 2 * i) / 18;
    samples.push({ x: oCx + Math.cos(t) * oRx, y: oCy + Math.sin(t) * oRy });
  }
  for (let i = 0; i < 6; i++) {
    const p = i / 5;
    samples.push({ x: rStemX, y: rTop + (rBottom - rTop) * p });
  }
  for (let i = 0; i < 9; i++) {
    const t = -Math.PI / 2 + Math.PI * i / 8;
    samples.push({ x: rStemX + rBowlRx + Math.cos(t) * rBowlRx, y: rTop + rBowlRy + Math.sin(t) * rBowlRy });
  }
  for (let i = 0; i < 7; i++) {
    const p = i / 6;
    samples.push({ x: rStemX + rBowlRx * .18 + rBowlRx * 1.3 * p, y: rMid + (rBottom - rMid) * p });
  }
  return samples;
}

function buildArmPathSamples(rect, records) {
  const mode = armAdminState.path || 'or';
  if (mode === 'none') return [];
  if (mode === 'or') return buildOrPathSamples(rect);
  const bounds = getArmStageBounds(rect);
  const { mobile, areaW, areaH, centerX, centerY, sidePad, topPad } = bounds;
  const count = Math.max(28, Math.min(48, records.length));
  const samples = [];
  if (mode === 'wave') {
    for (let i = 0; i < count; i++) {
      const p = count <= 1 ? 0 : i / (count - 1);
      samples.push({
        x: sidePad + areaW * p,
        y: centerY + Math.sin(p * Math.PI * 2.2) * areaH * (mobile ? .18 : .22),
      });
    }
  } else if (mode === 'orbit') {
    for (let i = 0; i < count; i++) {
      const t = -Math.PI / 2 + (Math.PI * 2 * i) / count;
      samples.push({
        x: centerX + Math.cos(t) * areaW * (mobile ? .35 : .40),
        y: centerY + Math.sin(t) * areaH * (mobile ? .28 : .34),
      });
    }
  } else if (mode === 'spiral') {
    for (let i = 0; i < count; i++) {
      const p = count <= 1 ? 0 : i / (count - 1);
      const t = -Math.PI / 2 + p * Math.PI * 5.2;
      const r = Math.sqrt(p);
      samples.push({
        x: centerX + Math.cos(t) * areaW * .39 * r,
        y: centerY + Math.sin(t) * areaH * .33 * r,
      });
    }
  } else if (mode === 'random') {
    const sorted = records.slice().sort((a, b) => armHash01((a.index + 1 + armAdminState.randomSeed) * 97) - armHash01((b.index + 1 + armAdminState.randomSeed) * 97));
    return sorted.map(record => record.pt);
  } else {
    for (let i = 0; i < count; i++) {
      const p = count <= 1 ? 0 : i / (count - 1);
      samples.push({ x: sidePad + areaW * p, y: topPad + areaH * .5 });
    }
  }
  return samples;
}

function assignOrPathNodes(records, rect) {
  const key = `${armState.layoutKey}:${armAdminState.path}:${Math.round(rect.width || 0)}x${Math.round(rect.height || 0)}:${records.length}`;
  if (armState.pathAssignmentKey === key) return;
  armState.pathAssignmentKey = key;
  records.forEach(({ node }) => {
    node.classList.remove('is-or-path');
    node.style.removeProperty('--or-step');
  });
  const samples = buildArmPathSamples(rect, records);
  const used = new Set();
  samples.forEach((sample, step) => {
    let best = null;
    let bestDist = Infinity;
    for (const record of records) {
      if (used.has(record.node)) continue;
      const dist = Math.hypot(record.pt.x - sample.x, record.pt.y - sample.y);
      if (dist < bestDist) {
        best = record;
        bestDist = dist;
      }
    }
    if (!best) return;
    used.add(best.node);
    best.node.classList.add('is-or-path');
    best.node.style.setProperty('--or-step', step);
  });
}

function positionArmNodes(ts) {
  if (!armState.nodesDirty) return;
  const rect = getArmStageSize();
  const nodes = armState.nodeEls.length ? armState.nodeEls : Array.from(armNodeLayer.querySelectorAll('.arm-node'));
  const count = Math.max(nodes.length, 1);
  const layout = getArmLayout(count, rect);
  const bounds = getArmStageBounds(rect);
  const globalBreath = Math.sin(ts * 0.00062);
  const records = [];
  nodes.forEach(node => {
    const index = Number(node.dataset.armIndex || 0);
    const p = armState.filtered[index];
    if (!p) return;
    const pt = getArmNodePoint(index, count, rect, layout, bounds);
    records.push({ node, p, pt, index });
  });
  assignOrPathNodes(records, rect);
  records.forEach(({ node, p, pt }) => {
    const focused = p.id === armState.focusedId;
    const focusLift = focused ? .14 : 0;
    const breath = 1 + globalBreath * (focused ? .006 : .014) * armAdminState.sway;
    const scale = clamp((.68 + pt.depth * .27 + focusLift) * breath, .66, 1.12);
    const opacity = focused ? 1 : clamp(.60 + pt.depth * .30 + globalBreath * .018, .58, .90);
    const rotateX = Math.cos(pt.theta + armState.phase * 2) * (focused ? 8 : 3);
    const rotateY = Math.sin(pt.theta + armState.phase * 1.6) * (focused ? 9 : 5);
    const rotateZ = Math.cos(pt.theta) * (focused ? 1.2 : 1.5);
    node.style.transform = `translate3d(${pt.x}px, ${pt.y}px, ${focused ? 56 : pt.depth * 30}px) translate(-50%, -50%) scale(${scale}) rotateX(${rotateX}deg) rotateY(${rotateY}deg) rotateZ(${rotateZ}deg)`;
    node.style.opacity = opacity.toFixed(3);
    node.style.zIndex = String(focused ? 860 : Math.round(120 + pt.depth * 520));
    node.classList.toggle('is-focused', focused);
    node.classList.toggle('is-muted', opacity < .28);
  });
  armState.nodesDirty = false;
}

const ARM_CSS_PARTICLE_BASE_COUNT = 126;
const ARM_CSS_PARTICLE_COUNT = Math.ceil(ARM_CSS_PARTICLE_BASE_COUNT * 1.8);
function armParticleRand(i, salt) {
  const x = Math.sin((i + 1) * 12.9898 + salt * 78.233) * 43758.5453;
  return x - Math.floor(x);
}
function ensureArmParticleField() {
  if (!armParticleField || armState.cssParticles.length) return;

      seed: armParticleRand(i, 8) * Math.PI * 2,
      drift: 2 + armParticleRand(i, 9) * 8,
      driftRate: 0.35 + armParticleRand(i, 10) * 0.9,
      scatter: 0.7 + armParticleRand(i, 11) * 0.85,

}
function resetArmParticleField() {
  armState.cssParticleSettling = false;
  armState.cssParticleStageW = 0;
  armState.cssParticleStageH = 0;
  armState.cssParticleVisibleCount = 0;

function getArmParticleRenderParams(width, height) {
  const density = clampSettingNumber(armState.particleDensity, 1, .35, 1.8);
  const brightness = clampSettingNumber(armState.particleBrightness, 1, .35, 1.8);
  const radiusScale = clampSettingNumber(armState.particleRadius, 1, .55, 1.8);
  const strengthScale = clampSettingNumber(armState.particleStrength, 1, .4, 2.2);
  const returnScale = clampSettingNumber(armState.particleReturn, 1, .35, 2.5);
  const key = [
    Math.round(width),
    Math.round(height),
    density.toFixed(2),
    brightness.toFixed(2),
    radiusScale.toFixed(3),
    strengthScale.toFixed(3),
    returnScale.toFixed(3),
  ].join(':');
  if (armState.particleRenderKey === key && armState.particleRenderParams) return armState.particleRenderParams;
  const strengthSqrt = Math.sqrt(strengthScale);
  armState.particleRenderKey = key;
  armState.particleRenderParams = {
    density,
    brightness,
    radiusScale,
    strengthScale,
    returnScale,
    strengthSqrt,
    visibleCount: Math.max(42, Math.round(ARM_CSS_PARTICLE_BASE_COUNT * density)),
    cssRadius: clamp(Math.min(width, height) * 0.19 * radiusScale, 72, 284),
    cssScatterEase: clamp(.32 * strengthSqrt, .18, .48),
    cssReturnEase: clamp(.13 * returnScale, .05, .34),
    dust: {
      xSpan: 29,
      ySpan: 15.5,
      radius: 7.2 * radiusScale,
      strength: 4.2 * strengthScale,
      zLift: 1.15 * strengthSqrt,
      swirl: .42 * strengthSqrt,
      scatterEase: clamp(.28 * strengthSqrt, .16, .44),
      returnEase: clamp(.12 * returnScale, .045, .32),
    },
    stars: {
      xSpan: 33,
      ySpan: 17,
      radius: 8.4 * radiusScale,
      strength: 2.7 * strengthScale,
      zLift: .72 * strengthSqrt,
      swirl: .28 * strengthSqrt,
      scatterEase: clamp(.2 * strengthSqrt, .12, .34),
      returnEase: clamp(.08 * returnScale, .035, .24),
    },
  };
  return armState.particleRenderParams;
}

function syncArmCssParticleVisibility(visibleCount) {
  if (armState.cssParticleVisibleCount === visibleCount) return false;
  armState.cssParticleVisibleCount = visibleCount;
  let changed = false;
  for (let i = 0; i < armState.cssParticles.length; i++) {
    const p = armState.cssParticles[i];
    const hidden = i >= visibleCount;
    const display = hidden ? 'none' : '';
    if (p.el.style.display !== display) {
      p.el.style.display = display;
      p.ready = false;
      changed = true;
    }
  }
  return changed;
}

function renderArmParticleField(ts = performance.now()) {
  const particleMode = armState.particleMode || 'auto';
  if (!armParticleField || armState.lowMotion || !armState.filtered.length || particleMode === 'off' || particleMode === 'webgl') return false;
  ensureArmParticleField();
  setArmParticleActualMode('css');
  const rect = getArmStageSize();
  const width = Math.max(1, rect.width || window.innerWidth);
  const height = Math.max(1, rect.height || 760);
  const resized = Math.abs(width - armState.cssParticleStageW) > 2 || Math.abs(height - armState.cssParticleStageH) > 2;
  if (resized) {
    armState.cssParticleStageW = width;
    armState.cssParticleStageH = height;
  }

  const active = armState.pointerActive && !armState.lowMotion;
  const cursorX = ((armState.pointerX + 1) / 2) * width;
  const cursorY = ((armState.pointerY + 1) / 2) * height;
  const params = getArmParticleRenderParams(width, height);
  const { brightness, strengthScale, strengthSqrt } = params;
  const visibleCount = params.visibleCount;
  const radius = params.cssRadius;
  const radiusSq = radius * radius;
  const scatterEase = params.cssScatterEase;
  const returnEase = params.cssReturnEase;
  const phase = armState.phase * Math.PI * 2;
  const timePhase = ts * 0.00012;
  let changed = syncArmCssParticleVisibility(visibleCount);
  let settling = active;

  for (let index = 0; index < visibleCount; index++) {
    const p = armState.cssParticles[index];
    let particleChanged = false;
    const depthDrift = 0.55 + p.depth * 0.8;
    const baseX = p.u * width + Math.sin(phase * p.driftRate + p.seed + timePhase) * p.drift * depthDrift;
    const baseY = p.v * height + Math.cos(phase * (p.driftRate + .23) + p.seed * 1.37 + timePhase) * p.drift * depthDrift;
    let targetX = baseX;
    let targetY = baseY;
    let targetZ = 0;
    let nearBoost = 0;

    if (active) {
      const dx = baseX - cursorX;
      const dy = baseY - cursorY;
      const distSq = dx * dx + dy * dy;
      if (distSq < radiusSq) {
        const dist = Math.sqrt(distSq);
        const falloff = (1 - dist / radius) ** 2;
        const angle = dist > 0.001 ? Math.atan2(dy, dx) : p.seed;
        const scatter = (44 + p.depth * 68) * p.scatter * falloff * strengthScale;
        const swirl = Math.sin(p.seed + phase * 9) * 18 * falloff * strengthSqrt;
        targetX = baseX + Math.cos(angle) * scatter - Math.sin(angle) * swirl;
        targetY = baseY + Math.sin(angle) * scatter + Math.cos(angle) * swirl;
        targetZ = 1 + 14 * falloff * strengthSqrt;
        nearBoost = falloff;
      }
    }

    if (!p.ready || resized) {
      p.x = baseX;
      p.y = baseY;
      p.z = 0;
      p.ready = true;
      particleChanged = true;
      changed = true;
    }

    const ease = active ? scatterEase : returnEase;
    const nextX = p.x + (targetX - p.x) * ease;
    const nextY = p.y + (targetY - p.y) * ease;
    const nextZ = p.z + (targetZ - p.z) * (active ? 0.3 : 0.16);
    if (
      Math.abs(nextX - p.x) > 0.08 ||
      Math.abs(nextY - p.y) > 0.08 ||
      Math.abs(nextZ - p.z) > 0.08
    ) {
      p.x = nextX;
      p.y = nextY;
      p.z = nextZ;
      particleChanged = true;
      changed = true;
    }
    if (Math.abs(p.x - baseX) > 0.8 || Math.abs(p.y - baseY) > 0.8 || Math.abs(p.z) > 0.4) settling = true;
    if (particleChanged) {
      p.el.style.transform = `translate3d(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px,0) scale(${(1 + p.z * .018 + nearBoost * .35).toFixed(3)})`;
      const baseOpacity = nearBoost > 0 ? 0.44 + nearBoost * .56 : p.alpha;
      p.el.style.opacity = clamp(baseOpacity * brightness, .08, 1).toFixed(2);
    }
  }

  armState.cssParticleSettling = settling;
  return changed;
}

      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    starMat.userData = { baseSize: .045, baseOpacity: .48 };
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    Object.assign(armState, {
      renderer,
      scene,
      camera,
      armGroup,
      dust,
      stars,
      dustBasePositions,
      starBasePositions,
      particleMaterialBrightness: brightness,
      webglParticlesSettling: false,
    });
    resizeArmScene();
    armState.staticRendered = false;
    startArmAnimation();
    if ('ResizeObserver' in window) {
      armState.resizeObserver = new ResizeObserver(resizeArmScene);
      armState.resizeObserver.observe(armStage);
    } else {
      window.addEventListener('resize', resizeArmScene);
    }
    setArmParticleActualMode('webgl');
  } catch (err) {
    console.warn('[orion-arm] WebGL scene disabled:', err);
    armStage.classList.add('no-webgl');
    setArmParticleActualMode('error', err?.message || err);
  } finally {
    armState.sceneLoading = false;
    updateArmParticleStatus();
  }
}

function resizeArmScene() {
  markArmStageSizeDirty();
  armState.layoutKey = '';
  armState.staticRendered = false;
  armState.nodesDirty = true;
  armState.pathAssignmentKey = '';
  resetArmParticleField();
  if (!armState.renderer || !armState.camera) return;
  const rect = getArmStageSize();
  const width = Math.max(1, Math.floor(rect.width));
  const height = Math.max(1, Math.floor(rect.height));
  armState.renderer.setSize(width, height, false);
  armState.camera.aspect = width / height;
  armState.camera.updateProjectionMatrix();
}

function disperseArmParticles(points, basePositions, opts) {
  const attr = points?.geometry?.attributes?.position;
  if (!attr || !basePositions) return false;
  const positions = attr.array;
  const active = armState.pointerActive && !armState.lowMotion;
  const cursorX = armState.pointerX * opts.xSpan;
  const cursorY = -armState.pointerY * opts.ySpan;
  const radius = opts.radius;
  const radiusSq = radius * radius;
  const ease = active ? opts.scatterEase : opts.returnEase;
  let changed = false;

  for (let i = 0; i < positions.length; i += 3) {
    const baseX = basePositions[i];
    const baseY = basePositions[i + 1];
    const baseZ = basePositions[i + 2];
    let targetX = baseX;
    let targetY = baseY;
    let targetZ = baseZ;

    if (active) {
      const dx = baseX - cursorX;
      const dy = baseY - cursorY;
      const distSq = dx * dx + dy * dy;
      if (distSq < radiusSq) {
        const dist = Math.sqrt(distSq);
        const falloff = (1 - dist / radius) ** 2;
        const invDist = dist > 0.001 ? 1 / dist : 1;
        const seed = i * 0.173 + armState.phase * Math.PI * 18;
        const swirlX = Math.sin(seed) * opts.swirl * falloff;
        const swirlY = Math.cos(seed * 1.31) * opts.swirl * falloff;
        targetX = baseX + dx * invDist * opts.strength * falloff + swirlX;
        targetY = baseY + dy * invDist * opts.strength * falloff + swirlY;
        targetZ = baseZ + opts.zLift * falloff;
      }
    }

    const nextX = positions[i] + (targetX - positions[i]) * ease;
    const nextY = positions[i + 1] + (targetY - positions[i + 1]) * ease;
    const nextZ = positions[i + 2] + (targetZ - positions[i + 2]) * ease;
    if (
      Math.abs(nextX - positions[i]) > 0.0005 ||
      Math.abs(nextY - positions[i + 1]) > 0.0005 ||
      Math.abs(nextZ - positions[i + 2]) > 0.0005
    ) {
      positions[i] = nextX;
      positions[i + 1] = nextY;
      positions[i + 2] = nextZ;
      changed = true;
    }
  }

  if (changed) attr.needsUpdate = true;
  return changed;
}

function tuneArmParticleMaterial(points, brightness) {
  const material = points?.material;
  if (!material) return;
  const baseSize = material.userData?.baseSize || material.size || .05;
  const baseOpacity = material.userData?.baseOpacity || material.opacity || .5;
  const nextSize = baseSize * clamp(Math.sqrt(brightness), .75, 1.35);
  const nextOpacity = clamp(baseOpacity * brightness, .12, baseOpacity > .6 ? .98 : .9);
  if (Math.abs(material.size - nextSize) > .0005) material.size = nextSize;
  if (Math.abs(material.opacity - nextOpacity) > .005) material.opacity = nextOpacity;
}

function renderArmScene() {
  if (armState.lowMotion) return;
  renderArmParticleField();
  if (!armState.renderer || !armState.scene || !armState.camera) return;
  setArmParticleActualMode('webgl');
  const size = getArmStageSize();
  const params = getArmParticleRenderParams(size.width, size.height);
  if (Math.abs(armState.particleMaterialBrightness - params.brightness) > .001) {
    tuneArmParticleMaterial(armState.dust, params.brightness);
    tuneArmParticleMaterial(armState.stars, params.brightness);
    armState.particleMaterialBrightness = params.brightness;
  }
  const particlesActive = armState.pointerActive && !armState.lowMotion;
  if (particlesActive || armState.webglParticlesSettling) {
    const dustChanged = disperseArmParticles(armState.dust, armState.dustBasePositions, params.dust);
    const starsChanged = disperseArmParticles(armState.stars, armState.starBasePositions, params.stars);
    armState.webglParticlesSettling = particlesActive || dustChanged || starsChanged;
  }
  armState.camera.position.x += (0 - armState.camera.position.x) * .08;
  armState.camera.position.y += (0 - armState.camera.position.y) * .08;
  armState.camera.lookAt(0, 0, 0);
  if (armState.armGroup) {
    armState.armGroup.rotation.z = armState.phase * Math.PI * 2 * .08;
    armState.armGroup.rotation.y = Math.sin(armState.phase * Math.PI * 2) * .035;
  }
  if (armState.stars) armState.stars.rotation.z = armState.phase * Math.PI * .04;
  armState.renderer.render(armState.scene, armState.camera);
}

function armUsesCssParticles() {
  const particleMode = armState.particleMode || 'auto';
  return !!(
    armParticleField &&
    !armState.lowMotion &&
    armState.filtered.length &&
    particleMode !== 'off' &&
    particleMode !== 'webgl' &&
    (!armState.renderer || particleMode === 'css')
  );
}

function startArmAnimation() {
  syncArmMotionButton();
  if (syncArmPerfPauseState()) return;
  if (armState.lowMotion) {
    stopArmAnimation();
    if (armState.nodesDirty) positionArmNodes(0);
    return;
  }
  if (armState.frameId || armState.frameTimer) return;
  const queueTick = (delay = 0) => {
    if (armState.frameId || armState.frameTimer) return;
    const requestFrame = () => {
      armState.frameTimer = 0;
      armState.frameId = requestAnimationFrame(tick);
    };
    if (delay > 32) armState.frameTimer = window.setTimeout(requestFrame, delay);
    else requestFrame();
  };
  const tick = (ts) => {
    armState.frameId = 0;
    const dt = armState.lastTs ? Math.min(48, ts - armState.lastTs) : 16;
    armState.lastTs = ts;
    const active = !armState.paused && !armState.pageHidden && armState.stageVisible;
    if (!active) {
      stopArmAnimation();
      syncArmPerfPauseState();
      return;
    }
    const cssParticlesActive = armUsesCssParticles();
    syncArmCssParticleClass(cssParticlesActive);
    const interactiveParticles = armState.pointerActive || armState.webglParticlesSettling || armState.cssParticleSettling;
    const shouldAdvancePhase = active && (isWallpaperMode || cssParticlesActive || interactiveParticles || !armState.staticRendered);
    if (shouldAdvancePhase) {
      armState.phase = (armState.phase + dt * 0.000016) % 1;
    }
    if (armState.nodesDirty) positionArmNodes(ts);
    const frameInterval = isWallpaperMode || cssParticlesActive
      ? 48
      : interactiveParticles
        ? 32
        : 900;
    const shouldPaint = active && (
      isWallpaperMode ||
      cssParticlesActive ||
      interactiveParticles ||
      !armState.staticRendered
    ) && (ts - armState.lastPaintTs) >= frameInterval;
    if (shouldPaint) {
      renderArmScene();
      armState.staticRendered = !(isWallpaperMode || armUsesCssParticles() || armState.pointerActive || armState.webglParticlesSettling || armState.cssParticleSettling);
      armState.lastPaintTs = ts;
    } else if (!armState.staticRendered) {
      renderArmScene();
      armState.staticRendered = !(isWallpaperMode || armUsesCssParticles() || armState.pointerActive || armState.webglParticlesSettling || armState.cssParticleSettling);
      armState.lastPaintTs = ts;
    }
    const hasContinuousWork = active && (isWallpaperMode || armUsesCssParticles() || armState.pointerActive || armState.webglParticlesSettling || armState.cssParticleSettling);
    const nextDelay = hasContinuousWork ? frameInterval : active ? 900 : 1200;
    queueTick(nextDelay);
  };
  queueTick(0);
}

function scheduleArmScene() {
  if (shouldUseStaticArmScene()) {
    armStage.classList.add('no-webgl');
    setArmParticleActualMode(armState.lowMotion || armReducedMotion ? 'blocked' : 'css');
    return;
  }
  if (armState.renderer || armState.sceneLoading || armState.sceneInitQueued || !armCanvas) return;
  armState.sceneInitQueued = true;
  updateArmParticleStatus();
  const run = () => {
    armState.sceneInitQueued = false;
    ensureArmScene();
  };
  if ('requestIdleCallback' in window) {
    window.requestIdleCallback(run, { timeout: 900 });
  } else {
    window.setTimeout(run, 180);
  }
}

function setArmStageVisible(visible) {
  const next = isWallpaperMode ? true : !!visible;
  if (armState.stageVisible === next) {
    syncArmPerfPauseState();
    return;
  }
  armState.stageVisible = next;
  syncArmPerfPauseState();
  if (!next) {
    armState.pointerActive = false;
    armState.pointerX = 0;
    armState.pointerY = 0;
    stopArmAnimation();
    return;
  }
  armState.staticRendered = false;
  markArmStagePositionDirty();
  wakeArmAnimation();
}

function initArmStageVisibilityObserver() {
  if (isWallpaperMode || !('IntersectionObserver' in window)) {
    setArmStageVisible(true);
    return;
  }
  if (armState.stageObserver) armState.stageObserver.disconnect();
  armState.stageObserver = new IntersectionObserver((entries) => {
    const entry = entries[0];
    setArmStageVisible(!!entry?.isIntersecting);
  }, { root: null, rootMargin: '160px 0px 160px 0px', threshold: 0 });
  armState.stageObserver.observe(armStage);
}

// =============== Player Card v2 · 球星卡 ===============
//   - flip card：点卡身翻面（desktop click / mobile tap），内嵌链接 stopPropagation
//   - 正面：位置色条 / 正式 chip / 头像 + 球衣号悬浮 / 名字 / Hero 双指标（积分+HR）
//          / 荣誉条（仅非零）/ 4 列基础数据 / 翻面提示
//   - 背面：赛季数据表（每赛季 AVG/OPS/H/2B/3B/HR/RBI + 总和高亮）
//          / 最近场次区（≤3 张，含日期/对手/批次/▶ 高亮标记）/ 查看面板链接
// =====================================================

// 位置 → 色条 class
function positionClass(pos) {
  const s = String(pos || '');
  if (/投手|\bP\b/i.test(s))             return 'pos-pitcher';
  if (/捕手|\bC\b/.test(s))              return 'pos-catcher';
  if (/外野|OF|LF|CF|RF|短外野|SF/i.test(s)) return 'pos-outfield';
  if (/内野|1B|2B|3B|SS|游击/.test(s))    return 'pos-infield';
  if (/工具人/.test(s))                  return 'pos-utility';
  return 'pos-default';
}

// 把 perGame 数据按赛季桶聚合
function aggregateBySeason(perGame, gameById) {
  const buckets = {};
  for (const pg of perGame) {
    if (pg.isAggregate) continue;
    const g = gameById.get(pg.gameId);
    const season = g?.season || (pg.date || '').slice(0, 4) || '?';
    if (!buckets[season]) {
      buckets[season] = { season, AB:0, R:0, H:0, RBI:0, BB:0, SO:0, _1B:0, _2B:0, _3B:0, HR:0, games:0 };
    }
    const b = buckets[season];
    b.AB+=pg.AB||0; b.R+=pg.R||0; b.H+=pg.H||0; b.RBI+=pg.RBI||0;
    b.BB+=pg.BB||0; b.SO+=pg.SO||0;
    b._1B+=pg._1B||0; b._2B+=pg._2B||0; b._3B+=pg._3B||0; b.HR+=pg.HR||0;
    b.games+=1;
  }
  return Object.values(buckets).map(s => {
    const AVG = s.AB ? s.H/s.AB : 0;
    const OBP = (s.AB+s.BB) ? (s.H+s.BB)/(s.AB+s.BB) : 0;
    const hasExtra = (s._1B+s._2B+s._3B+s.HR) > 0;
    const tb = hasExtra ? (s._1B+2*s._2B+3*s._3B+4*s.HR) : (s.H * 1.5);
    const SLG = s.AB ? tb/s.AB : 0;
    return { ...s, AVG, OBP, SLG, OPS: OBP+SLG };
  }).sort((a,b) => String(b.season).localeCompare(String(a.season)));
}

// 荣誉：从 player.titles[] 解析 MVP / 银棒 / 金手套 / 最佳投手 数量 + HOF 标记
function parseAwards(player, hofSet) {
  const out = { mvp:0, silverBat:0, goldGlove:0, bestPitcher:0, hof: hofSet.has(player.id) };
  for (const t of (player.titles||[])) {
    if (/赛季\s*MVP|赛季最佳/i.test(t)) out.mvp++;
    else if (/银棒/i.test(t))           out.silverBat++;
    else if (/金手套/i.test(t))         out.goldGlove++;
    else if (/最佳投手/i.test(t))       out.bestPitcher++;
  }
  return out;
}

function formatAvg(n) {
  if (!Number.isFinite(n) || n === 0) return '—';
  // OPS 可能 ≥ 1，正常显示 N.XXX；AVG/OBP/SLG < 1，显示 .XXX
  if (n >= 1) return n.toFixed(3);
  return '.' + (n*1000|0).toString().padStart(3,'0');
}

// 根据球员实际数据/荣誉，动态挑出最 impressive 的一项作为右边 Hero badge
// 优先级（高→低）：名人堂 > 赛季 MVP > 银棒 > 金手套 > 最佳投手 > 单场 MVP > HR > 三围 fallback > Rookie
function pickHeroBadge(p, stats, awards, mvpCount) {
  if (awards.hof)          return { icon: '🏆', val: '名 人 堂',     label: 'HALL OF FAME', kind: 'hof'     };
  if (awards.mvp)          return { icon: '⭐', val: awards.mvp,    label: '赛 季 MVP',    kind: 'mvp'     };
  if (awards.silverBat)    return { icon: '🥇', val: awards.silverBat, label: '银 棒 奖',  kind: 'silver'  };
  if (awards.goldGlove)    return { icon: '🧤', val: awards.goldGlove, label: '金 手 套',  kind: 'glove'   };
  if (awards.bestPitcher)  return { icon: '🏅', val: awards.bestPitcher, label: '最 佳 投 手', kind: 'pitcher' };
  if (mvpCount > 0)        return { icon: '⭐', val: mvpCount,      label: '场 次 MVP',    kind: 'gameMvp' };
  if ((stats.HR||0) > 0)   return { icon: '⚡', val: stats.HR,      label: '全 垒 打',     kind: 'hr'      };
  if ((stats.AB||0) > 0)   return { icon: '🎯', val: formatAvg(stats.AVG), label: '打 击 率', kind: 'avg'  };
  return { icon: '🌱', val: '新 秀', label: '', kind: 'rookie' };
}

      </div>
      ${onlineDot}
      <span class="pcv-flip-corner" title="点击翻面看赛季数据" aria-label="翻面">↻</span>
      <div class="pcv-avatar-wrap${identityAvatarWrapClass(identity)}">
        <img class="pc-photo${identityAvatarClass(identity)}" src="${escapeAttr(identity.avatar)}" alt="${escapeAttr(cardPhotoAlt)}" loading="lazy" onerror="this.src='${DB.DEFAULT_PUBLIC_PLAYER_AVATAR || 'assets/img/logo.jpg'}'">
        <span class="pcv-jersey">#${escapeAttr(num)}</span>
      </div>
      <div class="pc-name${identityNameClass(identity)}"${identityHiddenAttr(identity)}>${escapeAttr(identity.name)}</div>
      <div class="pc-meta">${posDisplay}${handed}</div>
      ${sloganRow}
      <div class="pcv-divider"><span>KEY STATS · 赛 季 亮 点</span></div>
      <div class="pcv-hero-row">
        ${heroPoints}
        ${heroDyn}
      </div>
      ${slashRow}
      ${awardsRow}
      <div class="pc-stats">
        <div><div class="pc-stat-v">${stats.games||0}</div><div class="pc-stat-k">GP</div></div>
        <div><div class="pc-stat-v">${stats.H||0}</div><div class="pc-stat-k">H</div></div>
        <div><div class="pc-stat-v">${stats._2B||0}</div><div class="pc-stat-k">2B</div></div>
        <div><div class="pc-stat-v">${stats._3B||0}</div><div class="pc-stat-k">3B</div></div>
        <div><div class="pc-stat-v ${(stats.HR||0)>0?'hr-stat':''}">${stats.HR||0}</div><div class="pc-stat-k">HR</div></div>
        <div><div class="pc-stat-v">${stats.RBI||0}</div><div class="pc-stat-k">RBI</div></div>
      </div>
    </div>`;

  // ==== 背面 ====
  const seasonRows = seasonStats.length
    ? seasonStats.map(s => `<tr>
        <td class="ssn">${s.season}</td>
        <td>${formatAvg(s.AVG)}</td>
        <td>${formatAvg(s.OPS)}</td>
        <td>${s.H}</td>
        <td>${s._2B||0}</td>
        <td>${s._3B||0}</td>
        <td class="${s.HR>0?'hot-hr':''}">${s.HR||0}</td>
        <td>${s.RBI}</td>
      </tr>`).join('')
    : `<tr><td colspan="8" class="empty-row">暂无比赛数据</td></tr>`;
  const totalsRow = seasonStats.length
    ? `<tr class="totals-row">
        <td>总 和</td>
        <td>${formatAvg(stats.AVG)}</td>
        <td>${formatAvg(stats.OBP + stats.SLG)}</td>
        <td>${stats.H||0}</td>
        <td>${stats._2B||0}</td>
        <td>${stats._3B||0}</td>
        <td class="${(stats.HR||0)>0?'hot-hr':''}">${stats.HR||0}</td>
        <td>${stats.RBI||0}</td>
      </tr>`
    : '';

  const recentHTML = recent.length
    ? `<div class="pcv-recent">
        <div class="pcv-back-subtitle">📌 最 近 场 次</div>
        ${recent.map(r => {
          const g = r.game;
          const isHome = g ? DB.isOrionTeam(g.home) : true;
          const opp = g ? (isHome ? g.away : g.home) : '—';
          const score = g ? (isHome ? `${g.homeScore}-${g.awayScore}` : `${g.awayScore}-${g.homeScore}`) : '';
          const win = g && (isHome ? g.homeScore>g.awayScore : g.awayScore>g.homeScore);
          const lineParts = [];
          if (r.AB) lineParts.push(`${r.H||0}-${r.AB}`);
          if ((r.HR||0)>0) lineParts.push(`⚡${r.HR}`);
          if ((r.RBI||0)>0) lineParts.push(`${r.RBI} RBI`);
          return `<a class="pcv-recent-row" href="game-detail.html?id=${encodeURIComponent(r.gameId)}" onclick="event.stopPropagation()">
            <div class="pcv-r-date">${(r.date||'').slice(5)}</div>
            <div class="pcv-r-opp">vs ${escapeAttr(opp.slice(0,8))}${r.hasHighlight?' <span class="pcv-r-hl">▶</span>':''}</div>
            <div class="pcv-r-score ${win?'win':''}">${score}</div>
            <div class="pcv-r-line">${lineParts.join(' · ')||'—'}</div>
          </a>`;
        }).join('')}
      </div>`
    : '';

  const backHTML = `
    <div class="face back">
      <div class="pcv-position-strip"></div>
      <div class="pcv-back-header">
        <span class="pcv-back-name${identityNameClass(identity)}"${identityHiddenAttr(identity)}>${escapeAttr(identity.name)}</span>
        <span class="pcv-back-sub">SEASON STATS</span>
      </div>
      <table class="pcv-season-table">
        <thead><tr>
          <th>赛季</th><th>AVG</th><th>OPS</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>RBI</th>
        </tr></thead>
        <tbody>${seasonRows}</tbody>
        ${totalsRow ? `<tfoot>${totalsRow}</tfoot>` : ''}
      </table>
      ${recentHTML}
      <div class="pcv-back-footer">
        <a class="pcv-nav-link" href="${playerDashboardHref(p)}" onclick="event.stopPropagation()">查看完整面板 →</a>
        <div class="pcv-flip-hint">↺ 翻回正面</div>
      </div>
    </div>`;

  return `<div class="player-card-shell ${posCls}${identityClass(identity)}" onclick="window.flipPlayerCard(this, event)" tabindex="0" aria-label="${escapeAttr(cardA11yName)} 球员卡">
    <div class="player-card-flip">
      ${frontHTML}
      ${backHTML}
    </div>
  </div>`;
}

// Globals: hofPlayerIdSet（名人堂球员 id 集合）和 highlightsByGameId（哪些 game 有视频）
const _hofPlayerIdSet = new Set(DB.allHallOfFame().map(h => h.playerId));
const _highlightsByGameId = new Set(DB.allHighlights().map(h => h.gameId));

// 单场 MVP 计数 map：canonical name key → 次数
const _gameMvpCountByPlayerKey = (function(){
  const map = new Map();
  for (const g of allGames) {
    if (g.isAggregate || !g.mvpPlayerName) continue;
    const key = DB.canonicalNameKey(g.mvpPlayerName);
    if (!key) continue;
    map.set(key, (map.get(key) || 0) + 1);
  }
  return map;
})();

// Flip handler — 桌面 click / mobile tap 都走这里
window.flipPlayerCard = function(shell, event) {
  // 如果点击在 nav-link 或 child anchor 上，stopPropagation 已让事件不传到这里
  // 但保险起见再判断一次：若 target 是 a 标签，不翻
  if (event && event.target && event.target.closest('a')) return;
  shell.classList.toggle('flipped');
};

function escapeAttr(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Wire up events（debounce 减少高频 input 重渲染开销）
const _onSearchInput = DB.debounce(() => {
  activeFilter.search = document.getElementById('searchInput').value.trim();
  render();
}, 180);
document.getElementById('searchInput').addEventListener('input', _onSearchInput);
posHost.addEventListener('click', e => {
  const btn = e.target.closest('.pos-chip');
  if (!btn) return;
  posHost.querySelectorAll('.pos-chip').forEach(b => b.classList.toggle('active', b === btn));
  activeFilter.pos = btn.dataset.pos;
  render();
});
armNodeLayer.addEventListener('pointerover', e => {
  const node = e.target.closest('.arm-node');
  if (!node) return;
  if (armState.hoverId === node.dataset.playerId && armState.focusedId === node.dataset.playerId) return;
  armState.hoverId = node.dataset.playerId;
  armState.staticRendered = false;
  setArmFocus(node.dataset.playerId, { soft: true });
});
armNodeLayer.addEventListener('pointerleave', () => {
  armState.hoverId = null;
  armState.staticRendered = false;
  if (!armState.lockedFocus) {
    armState.focusedId = null;
    armState.nodesDirty = true;
    positionArmNodes(performance.now());
  }
});
armNodeLayer.addEventListener('click', e => {
  const node = e.target.closest('.arm-node');
  if (!node) return;
  const player = armState.filtered.find(p => p.id === node.dataset.playerId);
  const origin = getArmAvatarOrigin(node, e);
  setArmFocus(node.dataset.playerId, { locked: true });
  node.classList.add('is-launching');
  window.setTimeout(() => node.classList.remove('is-launching'), 620);
  openArmCardModal(player, origin);
});
armNodeLayer.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const node = e.target.closest('.arm-node');
  if (!node) return;
  e.preventDefault();
  const player = armState.filtered.find(p => p.id === node.dataset.playerId);
  const origin = getArmAvatarOrigin(node, e);
  setArmFocus(node.dataset.playerId, { locked: true });
  node.classList.add('is-launching');
  window.setTimeout(() => node.classList.remove('is-launching'), 620);
  openArmCardModal(player, origin);
});
armCardModal.addEventListener('click', e => {
  if (e.target.closest('[data-arm-card-close]')) closeArmCardModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeArmCardModal();
});
function applyArmPointer() {
  armState.pointerRaf = 0;
  if (armState.lowMotion || armState.pageHidden || !armState.stageVisible) return;
  const rect = getArmStageClientRect();
  if (!rect.width || !rect.height) return;
  armState.pointerActive = true;
  armState.pointerX = clamp(((armState.pointerClientX - rect.left) / rect.width) * 2 - 1, -1, 1);
  armState.pointerY = clamp(((armState.pointerClientY - rect.top) / rect.height) * 2 - 1, -1, 1);
  armState.staticRendered = false;
  wakeArmAnimation();
}
armStage.addEventListener('pointermove', e => {
  if (armState.lowMotion || armState.pageHidden || !armState.stageVisible) return;
  if (Math.abs(e.clientX - armState.pointerClientX) < 1.5 && Math.abs(e.clientY - armState.pointerClientY) < 1.5) return;
  armState.pointerClientX = e.clientX;
  armState.pointerClientY = e.clientY;
  if (!armState.pointerRaf) armState.pointerRaf = requestAnimationFrame(applyArmPointer);
}, { passive: true });
armStage.addEventListener('pointerleave', () => {
  if (armState.pointerRaf) {
    cancelAnimationFrame(armState.pointerRaf);
    armState.pointerRaf = 0;
  }
  armState.pointerX = 0;
  armState.pointerY = 0;
  armState.pointerActive = false;
  armState.webglParticlesSettling = true;
  armState.staticRendered = false;
  wakeArmAnimation();
});
armMotionToggle.addEventListener('click', () => {
  setArmLowMotion(!armState.lowMotion, { persist: true });
});
window.addEventListener('resize', () => {
  invalidateArmLayout();
  resetArmParticleField();
  if (armState.lowMotion) positionArmNodes(0);
}, { passive: true });
window.addEventListener('scroll', markArmStagePositionDirty, { passive: true });
document.addEventListener('visibilitychange', () => {
  armState.pageHidden = document.hidden;
  syncArmPerfPauseState();
  if (document.hidden) {
    armState.pointerActive = false;
    stopArmAnimation();
    return;
  }
  markArmStagePositionDirty();
  loadArmGlobalSettings({ apply: true, silent: true, skipIfDirty: true });
  wakeArmAnimation();
});

await loadArmGlobalSettings({ silent: true });
syncArmMotionButton();
initArmAdminPanel();
render();
initArmStageVisibilityObserver();
startArmGlobalSettingsPolling();
})();
</script>
</body>
</html>
