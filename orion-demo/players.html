/* ============ Player Card v2.4 · 轻玻璃球星卡 ============ */

/* === 卡片外壳 — Topps 标准球星卡比例 2.5×3.5 = 1:1.4 === */
.player-card-shell {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1.4;
  min-height: 460px;
  perspective: 1400px;
  cursor: pointer;
  transition: transform .3s var(--ease);
  outline: none;
}
.player-card-shell:hover { transform: translateY(-4px); }
.player-card-shell:focus-visible {
  box-shadow: 0 0 0 2px var(--gold-bright);
  border-radius: var(--r-lg);
}

.player-card-flip {
  position: relative;
  width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform .65s cubic-bezier(.3,.2,.2,1);
}
.player-card-shell.flipped .player-card-flip {
  transform: rotateY(180deg);
}
.player-card-shell:not(.flipped):hover .player-card-flip {
  transform: rotateX(4deg) rotateY(-5deg) translateZ(12px);
}
.player-card-shell.flipped:hover .player-card-flip {
  transform: rotateY(180deg) rotateX(3deg) translateZ(10px);
}

.player-card-shell .face {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center;
  padding: 12px 14px 6px;
  border-radius: var(--r-lg);
  background:
    radial-gradient(120% 80% at 50% -20%, rgba(46,107,255,.25) 0%, transparent 55%),
    radial-gradient(85% 62% at 18% 12%, rgba(255,255,255,.105) 0%, transparent 43%),
    linear-gradient(165deg, rgba(20,45,88,.74) 0%, rgba(8,20,46,.82) 58%, rgba(5,11,24,.88) 100%);
  border: 1px solid rgba(255,255,255,.14);
  box-shadow:
    0 12px 34px rgba(0,0,0,.46),
    0 0 0 1px rgba(228,199,122,.07),
    inset 0 1px 0 rgba(255,255,255,.22),
    inset 0 0 0 1px rgba(46,107,255,.10),
    inset 0 -48px 72px rgba(0,0,0,.26);
  -webkit-backdrop-filter: blur(16px) saturate(138%);
  backdrop-filter: blur(16px) saturate(138%);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
  isolation: isolate;
}
.player-card-shell .face.back {
  transform: rotateY(180deg);
}
.player-card-shell:hover .face {
  border-color: rgba(228,199,122,.28);
  box-shadow:
    0 18px 44px rgba(0,0,0,.58),
    0 0 22px rgba(228,199,122,.10),
    0 0 34px rgba(46,107,255,.10),
    inset 0 1px 0 rgba(255,255,255,.24);
}

/* 卡面顶部 holographic 微光斜条（hover 时变亮） */
.player-card-shell .face::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(115deg,
    transparent 0%, transparent 38%,
    rgba(255,255,255,.032) 48%,
    rgba(228,199,122,.048) 50%,
    rgba(255,255,255,.03) 52%,
    transparent 62%, transparent 100%);
  opacity: .38;
  pointer-events: none;
  transition: opacity .3s var(--ease);
  z-index: 0;
}
.player-card-shell:hover .face::before { opacity: .62; }
.player-card-shell .face::after {
  content: '';
  position: absolute;
  inset: -35% -55%;
  background:
    linear-gradient(105deg,
      transparent 0%,
      rgba(91,139,255,.05) 34%,
      rgba(255,255,255,.105) 44%,
      rgba(228,199,122,.095) 49%,
      rgba(255,255,255,.05) 54%,
      transparent 66%),
    radial-gradient(circle at 70% 30%, rgba(228,199,122,.10), transparent 24%);
  opacity: 0;
  transform: translateX(-35%) rotate(8deg);
  pointer-events: none;
  transition: opacity .35s var(--ease), transform .9s var(--ease-out);
  z-index: 2;
}
.player-card-shell:hover .face::after {
  opacity: .42;
  transform: translateX(28%) rotate(8deg);
}

/* === 顶部 4px 位置色条 === */
.pcv-position-strip {
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, transparent 0%, var(--strip-color, var(--blue-400)) 20%, var(--strip-color, var(--blue-400)) 80%, transparent 100%);
  box-shadow: 0 0 12px var(--strip-color, var(--blue-400));
  z-index: 1;
}
.player-card-shell.pos-pitcher  { --strip-color: #5b8bff; }
.player-card-shell.pos-infield  { --strip-color: #e4c77a; }
.player-card-shell.pos-outfield { --strip-color: #6ee7b7; }
.player-card-shell.pos-catcher  { --strip-color: #c084fc; }
.player-card-shell.pos-utility  { --strip-color: #f59e0b; }
.player-card-shell.pos-default  { --strip-color: #5b8bff; }

/* === 顶部行：正式 chip === */
/* backface-visibility 单独写一次：z-index 子元素在某些浏览器里会脱离父级 face 的 3D
   stacking context，导致翻转后还能看到镜像。每个绝对定位子元素都自己声明一次更稳。 */
.pcv-tl-row,
.pcv-tl-row .pcv-verified-chip,
.player-card-shell .pc-online-dot,
.pcv-position-strip {
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.pcv-tl-row {
  position: absolute; top: 14px; left: 14px;
  z-index: 2;
}
.pcv-verified-chip {
  font-family: var(--font-display);
  font-size: 11px; font-weight: 600;
  padding: 4px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, rgba(91,139,255,.26), rgba(255,255,255,.055));
  border: 1px solid rgba(143,176,255,.42);
  color: var(--blue-300);
  letter-spacing: .12em;
  -webkit-backdrop-filter: blur(10px) saturate(135%);
  backdrop-filter: blur(10px) saturate(135%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.16);
  white-space: nowrap;
}

/* 在线状态点（已有 .pc-online-dot 全局样式，这里只保持位置） */
.player-card-shell .pc-online-dot {
  top: 16px; right: 14px;
}

/* === 头像 + 球衣号叠加 === */
.pcv-avatar-wrap {
  position: relative;
  margin: 12px auto 6px;
  width: 140px; height: 140px;
}
.pcv-avatar-wrap::before {
  content: '';
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  background:
    conic-gradient(from 18deg,
      rgba(228,199,122,.10),
      color-mix(in srgb, var(--strip-color, var(--blue-400)) 45%, transparent),
      rgba(255,255,255,.08),
      rgba(228,199,122,.12));
  filter: blur(12px);
  opacity: .44;
  transform: translateZ(-1px);
  transition: opacity .3s var(--ease), filter .3s var(--ease);
}
.player-card-shell:hover .pcv-avatar-wrap::before {
  opacity: .82;
  filter: blur(16px);
}
.pcv-avatar-wrap .pc-photo {
  position: relative;
  z-index: 1;
  width: 140px; height: 140px; border-radius: 50%;
  object-fit: cover; object-position: center 20%;
  border: 3px solid var(--strip-color, var(--blue-400));
  box-shadow:
    0 0 24px color-mix(in srgb, var(--strip-color, var(--blue-400)) 45%, transparent),
    inset 0 0 0 1px rgba(255,255,255,.1);
  background: var(--navy-900);
  transition: all .3s var(--ease);
}
.pcv-avatar-wrap.is-frosted-avatar::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
  border-radius: 50%;
  background:
    linear-gradient(135deg, rgba(255,255,255,.38), rgba(210,226,255,.10) 34%, rgba(255,255,255,.24) 68%, rgba(58,82,126,.16)),
    radial-gradient(circle at 28% 18%, rgba(255,255,255,.36), transparent 34%),
    radial-gradient(circle at 68% 78%, rgba(137,178,255,.20), transparent 38%);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.20),
    0 0 24px rgba(174,203,255,.20),
    0 0 34px rgba(228,199,122,.12),
    inset 0 1px 0 rgba(255,255,255,.42),
    inset 0 -18px 30px rgba(9,18,36,.20);
  animation: frosted-card-glint 5.8s ease-in-out infinite;
}
.pcv-avatar-wrap .pc-photo.identity-frosted-avatar {
  filter: blur(4.8px) saturate(.78) contrast(.92) brightness(.88);
  transform: none;
  -webkit-clip-path: circle(50% at 50% 50%);
  clip-path: circle(50% at 50% 50%);
  contain: paint;
}
.player-card-shell:hover .pcv-avatar-wrap .pc-photo {
  box-shadow:
    0 0 36px color-mix(in srgb, var(--strip-color, var(--blue-400)) 70%, transparent),
    inset 0 0 0 1px rgba(255,255,255,.14);
}
.pcv-jersey {
  position: absolute; bottom: -2px; right: -2px;
  min-width: 36px; height: 36px;
  padding: 0 8px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(145deg, rgba(8,18,40,.78), rgba(31,54,96,.56));
  border: 2px solid rgba(228,199,122,.9);
  border-radius: 999px;
  font-family: var(--font-display);
  font-size: 15px; font-weight: 700;
  color: var(--gold-bright);
  letter-spacing: .02em;
  -webkit-backdrop-filter: blur(10px) saturate(130%);
  backdrop-filter: blur(10px) saturate(130%);
  box-shadow: 0 3px 8px rgba(0,0,0,.42), 0 0 14px rgba(228,199,122,.24), inset 0 1px 0 rgba(255,255,255,.18);
  z-index: 3;
}

/* === 名字 === */
.player-card-shell .pc-name {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 700;
  text-align: center;
  color: var(--text);
  margin: 0 0 4px;
  letter-spacing: -.01em;
  line-height: 1.1;
}
.player-card-shell .pc-name.identity-frosted-name,
.pcv-back-name.identity-frosted-name {
  filter: blur(2.6px);
  opacity: .82;
  color: rgba(232,238,250,.86);
  text-shadow:
    0 0 9px rgba(232,238,250,.36),
    0 4px 16px rgba(0,0,0,.72);
  user-select: none;
  animation: frosted-name-twinkle 5.6s ease-in-out infinite;
  will-change: opacity;
}
.pcv-back-name.identity-frosted-name {
  display: inline-block;
}

/* === Meta（位置 / B/T）=== */
.player-card-shell .pc-meta {
  font-size: 10.5px; letter-spacing: .12em;
  color: var(--text-mute);
  text-align: center;
  margin-bottom: 4px;
}
.player-card-shell .pc-meta .sep { margin: 0 5px; opacity: .4; }

/* === Slogan（如有）=== */
.pcv-slogan {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 12px;
  color: var(--gold-bright);
  opacity: .88;
  margin: 4px 0 2px;
  letter-spacing: .04em;
  text-align: center;
  max-width: 90%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-shadow: 0 0 12px rgba(228,199,122,.24);
}

/* === KEY STATS 分隔线 === */
.pcv-divider {
  width: 100%;
  margin: 6px 0 6px;
  text-align: center;
  position: relative;
}
.pcv-divider::before,
.pcv-divider::after {
  content: ''; position: absolute; top: 50%;
  width: calc(50% - 80px); height: 1px;
  background: linear-gradient(90deg, transparent, rgba(228,199,122,.4), transparent);
}
.pcv-divider::before { left: 0; }
.pcv-divider::after  { right: 0; }
.pcv-divider span {
  display: inline-block;
  font-size: 9px; letter-spacing: .25em;
  color: var(--gold-bright);
  font-family: var(--font-display);
  font-weight: 600;
  text-transform: uppercase;
  background: transparent;
  padding: 0 8px;
}

/* === Hero 双指标 === */
.pcv-hero-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  width: 100%;
  margin-bottom: 6px;
}
.pcv-hero {
  text-align: center;
  padding: 5px 4px 6px;
  border-radius: var(--r-sm);
  background: linear-gradient(180deg, rgba(255,255,255,.072), rgba(255,255,255,.026));
  border: 1px solid rgba(255,255,255,.12);
  -webkit-backdrop-filter: blur(11px) saturate(135%);
  backdrop-filter: blur(11px) saturate(135%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 8px 18px rgba(0,0,0,.13);
}
.pcv-hero-val {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 700;
  line-height: 1;
  margin-bottom: 3px;
  letter-spacing: -.01em;
  display: inline-flex;
  align-items: baseline;
  justify-content: center;
  gap: 4px;
}
/* Emoji icon 单独控制大小 — 不被自身高度撑大文本视觉权重 */
.pcv-hero-val .pcv-hero-ico {
  font-size: .7em;
  line-height: 1;
  display: inline-block;
  transform: translateY(1px);  /* 视觉对齐到文字基线附近 */
}
.pcv-hero-val .pcv-hero-text { font-size: inherit; }
.pcv-hero-pts .pcv-hero-val { color: var(--gold-bright); }

/* === Dynamic Hero badge — 按 kind 上色 === */
/* 名人堂 — 最贵气的金 + 强光晕；文字类 val 字号比数字类小，视觉重量对齐 */
.pcv-hero-dyn.kind-hof .pcv-hero-val {
  color: #ffe28a;
  font-size: 18px;
  letter-spacing: .06em;
}
.pcv-hero-dyn.kind-hof.glow {
  border-color: rgba(228,199,122,.65);
  background: linear-gradient(180deg, rgba(228,199,122,.20), rgba(255,255,255,.035));
  box-shadow: 0 0 18px rgba(228,199,122,.26), inset 0 1px 0 rgba(255,255,255,.16);
}
.pcv-hero-dyn.kind-hof.glow .pcv-hero-val {
  text-shadow: 0 0 14px rgba(255,210,120,.6);
}

/* 赛季 MVP / 场次 MVP — 金色 */
.pcv-hero-dyn.kind-mvp .pcv-hero-val,
.pcv-hero-dyn.kind-gameMvp .pcv-hero-val { color: #ffe28a; }
.pcv-hero-dyn.kind-mvp.glow {
  border-color: rgba(228,199,122,.55);
  background: linear-gradient(180deg, rgba(228,199,122,.14), rgba(255,255,255,.026));
  box-shadow: 0 0 15px rgba(228,199,122,.22), inset 0 1px 0 rgba(255,255,255,.12);
}
.pcv-hero-dyn.kind-mvp.glow .pcv-hero-val {
  text-shadow: 0 0 12px rgba(255,210,120,.5);
}

/* 银棒 — 银色 */
.pcv-hero-dyn.kind-silver .pcv-hero-val { color: #d8e0ec; }
.pcv-hero-dyn.kind-silver { border-color: rgba(200,212,232,.28); background: linear-gradient(180deg, rgba(200,212,232,.09), rgba(255,255,255,.024)); }

/* 金手套 — 绿调 */
.pcv-hero-dyn.kind-glove .pcv-hero-val { color: #6ee7b7; }
.pcv-hero-dyn.kind-glove { border-color: rgba(110,231,183,.28); background: linear-gradient(180deg, rgba(110,231,183,.09), rgba(255,255,255,.024)); }

/* 最佳投手 — 蓝调 */
.pcv-hero-dyn.kind-pitcher .pcv-hero-val { color: #8bb0ff; }
.pcv-hero-dyn.kind-pitcher { border-color: rgba(139,176,255,.28); background: linear-gradient(180deg, rgba(46,107,255,.10), rgba(255,255,255,.024)); }

/* HR — 橙金（同之前）*/
.pcv-hero-dyn.kind-hr .pcv-hero-val { color: #ffd86a; }
.pcv-hero-dyn.kind-hr.glow {
  border-color: rgba(255,180,80,.45);
  background: linear-gradient(180deg, rgba(255,140,40,.12), rgba(255,255,255,.024));
  box-shadow: 0 0 14px rgba(255,180,80,.18), inset 0 1px 0 rgba(255,255,255,.11);
}
.pcv-hero-dyn.kind-hr.glow .pcv-hero-val {
  text-shadow: 0 0 12px rgba(255,200,100,.45);
}

/* 三围 fallback — 暖金 subtle */
.pcv-hero-dyn.kind-avg .pcv-hero-val { color: var(--gold); font-size: 22px; }
.pcv-hero-dyn.kind-avg { border-color: rgba(228,199,122,.18); background: linear-gradient(180deg, rgba(228,199,122,.075), rgba(255,255,255,.023)); }

/* Rookie fallback — 青绿；"新 秀" 跟正常 val 一样字号，靠 hero-ico 把 emoji 缩小避免比例失衡 */
.pcv-hero-dyn.kind-rookie .pcv-hero-val {
  color: #6ee7b7;
  font-size: 17px;
  letter-spacing: .06em;
  align-items: center;
  gap: 3px;
  line-height: 1;
  margin: 0;
}
.pcv-hero-dyn.kind-rookie .pcv-hero-ico {
  font-size: .56em;
  transform: translateY(-.5px);
}
.pcv-hero-dyn.kind-rookie .pcv-hero-text {
  letter-spacing: .12em;
}
.pcv-hero-dyn.kind-rookie {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 47px;
  padding: 0 4px;
  border-color: rgba(110,231,183,.28);
  background: linear-gradient(180deg, rgba(110,231,183,.10), rgba(255,255,255,.024));
}
.pcv-hero-label {
  font-size: 9px;
  letter-spacing: .22em;
  color: var(--text-mute);
  text-transform: uppercase;
}
.pcv-hero-label:empty { display: none; }

/* === Slash line — AVG / OBP / SLG + OPS === */
.pcv-slash {
  width: 100%;
  margin: 4px 0 4px;
  padding: 5px 8px;
  background: linear-gradient(180deg, rgba(228,199,122,.075), rgba(255,255,255,.025));
  border: 1px solid rgba(228,199,122,.18);
  border-radius: var(--r-sm);
  display: flex; align-items: baseline; justify-content: center;
  gap: 6px;
  -webkit-backdrop-filter: blur(10px) saturate(132%);
  backdrop-filter: blur(10px) saturate(132%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.11);
  font-family: var(--font-display);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--gold-bright);
  letter-spacing: .02em;
}
.pcv-slash .ps-sep { opacity: .35; font-weight: 400; margin: 0 1px; }
.pcv-slash .ps-ops {
  margin-left: 6px;
  padding-left: 8px;
  border-left: 1px solid rgba(228,199,122,.25);
  font-size: 12px;
  color: var(--text);
}
.pcv-slash .ps-ops-label {
  font-size: 9px; opacity: .6;
  letter-spacing: .12em;
  margin-right: 3px;
}

/* === 荣誉条 === */
.pcv-awards-row {
  display: flex; flex-wrap: wrap; gap: 4px;
  justify-content: center;
  margin: 6px 0 8px;
  max-width: 100%;
}
.pcv-award {
  font-size: 9.5px;
  padding: 2px 7px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,.065), rgba(228,199,122,.035));
  border: 1px solid rgba(228,199,122,.26);
  color: var(--gold-bright);
  letter-spacing: .06em;
  white-space: nowrap;
  font-family: var(--font-display);
  font-weight: 600;
  -webkit-backdrop-filter: blur(9px) saturate(130%);
  backdrop-filter: blur(9px) saturate(130%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
}
.pcv-award.hof {
  background: linear-gradient(135deg, rgba(228,199,122,.18), rgba(255,255,255,.045));
  border-color: rgba(228,199,122,.55);
  box-shadow: 0 0 12px rgba(228,199,122,.18), inset 0 1px 0 rgba(255,255,255,.16);
}

/* === 基础数据 6 列（H/2B/3B/HR/RBI/GP）— 计数统计紧凑展示 === */
.player-card-shell .pc-stats {
  display: grid; grid-template-columns: repeat(6, 1fr);
  gap: 0;
  width: 100%;
  margin-top: auto;
  padding: 6px 0 4px;
  border-top: 1px solid rgba(228,199,122,.18);
}
.player-card-shell .pc-stat-v {
  font-family: var(--font-display);
  font-size: 14px;
  color: var(--gold-bright);
  text-align: center;
  font-weight: 600;
  line-height: 1;
}
.player-card-shell .pc-stat-v.hr-stat {
  color: #ffd86a;
  text-shadow: 0 0 8px rgba(255,200,100,.4);
}
.player-card-shell .pc-stat-k {
  font-size: 9px;
  line-height: 1.2;          /* 固定行高，避免被 face overflow:hidden 截 */
  letter-spacing: .14em;
  color: var(--text-mute);
  text-align: center;
  text-transform: uppercase;
  margin-top: 3px;
  padding-bottom: 0;
}

/* === 翻面图标按钮（替代底部 hint，省空间）=== */
.pcv-flip-corner {
  position: absolute;
  top: 12px; right: 38px;   /* 紧贴 online dot 左边 */
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(228,199,122,.22);
  color: var(--gold-bright);
  font-size: 12px; line-height: 1;
  cursor: pointer;
  z-index: 3;
  opacity: .55;
  transition: all .2s var(--ease);
  -webkit-backdrop-filter: blur(10px) saturate(135%);
  backdrop-filter: blur(10px) saturate(135%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.player-card-shell:hover .pcv-flip-corner {
  opacity: 1;
  background: rgba(228,199,122,.14);
  border-color: var(--gold-bright);
  box-shadow: 0 0 9px rgba(228,199,122,.24), inset 0 1px 0 rgba(255,255,255,.18);
}

/* === 翻面提示（仅背面用，保留底部位置）=== */
.pcv-flip-hint {
  font-size: 9px;
  line-height: 1.2;
  color: var(--text-mute);
  opacity: .5;
  letter-spacing: .14em;
  margin-top: 3px;
  text-align: center;
  transition: opacity .25s var(--ease);
}
.player-card-shell:hover .pcv-flip-hint { opacity: .9; color: var(--gold-bright); }

/* === 背面 === */
.player-card-shell .face.back {
  justify-content: flex-start;
  padding-top: 16px;
}
.pcv-back-header {
  text-align: center;
  margin: 6px 0 12px;
}
.pcv-back-name {
  display: block;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: .01em;
}
.pcv-back-sub {
  display: block;
  font-size: 9px;
  letter-spacing: .35em;
  color: var(--gold-bright);
  margin-top: 4px;
  font-family: var(--font-display);
}

/* === 赛季数据表 === */
.pcv-season-table {
  width: 100%;
  font-size: 11px;
  border-collapse: collapse;
  margin-bottom: 8px;
  background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.012));
  border: 1px solid rgba(255,255,255,.055);
  border-radius: var(--r-sm);
  overflow: hidden;
  -webkit-backdrop-filter: blur(9px) saturate(130%);
  backdrop-filter: blur(9px) saturate(130%);
}
.pcv-season-table th {
  font-family: var(--font-display);
  color: var(--gold-bright);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  padding: 4px 2px;
  border-bottom: 1px solid rgba(228,199,122,.3);
  text-align: center;
}
.pcv-season-table th:first-child { text-align: left; padding-left: 4px; }
.pcv-season-table td {
  text-align: center;
  padding: 4px 2px;
  border-bottom: 1px dashed rgba(255,255,255,.04);
  color: var(--text);
  font-size: 11px;
  font-family: var(--font-display);
  font-weight: 500;
}
.pcv-season-table td.ssn {
  color: var(--blue-300);
  text-align: left;
  padding-left: 4px;
  font-weight: 700;
}
.pcv-season-table td.hot-hr {
  color: #ffd86a;
  font-weight: 700;
  text-shadow: 0 0 6px rgba(255,200,100,.4);
}
.pcv-season-table tfoot .totals-row td {
  border-top: 1px solid rgba(228,199,122,.4);
  border-bottom: none;
  color: var(--gold-bright);
  font-weight: 700;
  padding-top: 5px;
  font-size: 11.5px;
}
.pcv-season-table tfoot .totals-row td:first-child {
  letter-spacing: .15em;
}
.pcv-season-table .empty-row {
  text-align: center;
  color: var(--text-mute);
  padding: 14px 0;
  font-style: italic;
}

/* === 最近场次 === */
.pcv-recent {
  margin-top: 6px;
}
.pcv-back-subtitle {
  font-size: 9px;
  letter-spacing: .25em;
  color: var(--gold-bright);
  font-family: var(--font-display);
  margin-bottom: 5px;
  text-transform: uppercase;
}
.pcv-recent-row {
  display: grid;
  grid-template-columns: 38px 1fr auto auto;
  gap: 6px;
  align-items: baseline;
  padding: 4px 6px;
  margin-bottom: 2px;
  font-size: 10.5px;
  border-radius: 4px;
  text-decoration: none;
  color: var(--text-dim);
  background: rgba(255,255,255,.032);
  border: 1px solid rgba(255,255,255,.04);
  -webkit-backdrop-filter: blur(8px) saturate(128%);
  backdrop-filter: blur(8px) saturate(128%);
  transition: background .2s var(--ease);
}
.pcv-recent-row:hover {
  background: rgba(46,107,255,.10);
  border-color: rgba(143,176,255,.16);
  color: var(--text);
}
.pcv-r-date {
  font-family: var(--font-display);
  color: var(--text-mute);
  font-size: 10px;
}
.pcv-r-opp { font-weight: 500; }
.pcv-r-hl {
  display: inline-block;
  color: var(--gold-bright);
  font-size: 9px;
  margin-left: 2px;
}
.pcv-r-score {
  font-family: var(--font-display);
  font-size: 10.5px;
  color: #ff8a8a;
}
.pcv-r-score.win { color: var(--gold-bright); }
.pcv-r-line {
  font-family: var(--font-display);
  font-size: 9.5px;
  color: var(--text-mute);
  letter-spacing: .04em;
}

/* === 背面 footer === */
.pcv-back-footer {
  margin-top: auto;
  padding-top: 8px;
  border-top: 1px solid rgba(228,199,122,.18);
  text-align: center;
  width: 100%;
}
.pcv-nav-link {
  display: inline-block;
  padding: 5px 14px;
  font-family: var(--font-display);
  font-size: 11px;
  color: var(--gold-bright);
  border: 1px solid rgba(228,199,122,.4);
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(228,199,122,.10), rgba(255,255,255,.03));
  text-decoration: none;
  letter-spacing: .06em;
  -webkit-backdrop-filter: blur(10px) saturate(135%);
  backdrop-filter: blur(10px) saturate(135%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
  transition: all .2s var(--ease);
}
.pcv-nav-link:hover {
  background: rgba(228,199,122,.16);
  color: #fff;
  border-color: var(--gold-bright);
  box-shadow: 0 0 12px rgba(228,199,122,.24), inset 0 1px 0 rgba(255,255,255,.16);
}

@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .player-card-shell .face {
    background:
      radial-gradient(120% 80% at 50% -20%, rgba(46,107,255,.22) 0%, transparent 55%),
      linear-gradient(165deg, rgba(18,39,78,.96) 0%, rgba(8,18,40,.98) 62%, rgba(5,11,24,.99) 100%);
  }
  .pcv-verified-chip,
  .pcv-hero,
  .pcv-slash,
  .pcv-award,
  .pcv-flip-corner,
  .pcv-season-table,
  .pcv-recent-row,
  .pcv-nav-link {
    background-color: rgba(12,26,48,.88);
  }
}

@media (max-width: 480px) {
  .player-card-shell { min-height: 440px; }
  .pcv-avatar-wrap { width: 112px; height: 112px; margin: 24px auto 6px; }
  .pcv-avatar-wrap .pc-photo { width: 112px; height: 112px; }
  .pcv-jersey { min-width: 32px; height: 32px; font-size: 13px; }
  .player-card-shell .pc-name { font-size: 20px; }
  .pcv-hero-val { font-size: 19px; }
  .pcv-slash { font-size: 12.5px; padding: 5px 6px; }
  .player-card-shell .pc-stat-v { font-size: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  .player-card-shell,
  .player-card-flip,
  .player-card-shell .face::after {
    transition: none !important;
    animation: none !important;
  }
}

/* ============ 旧球员卡兼容（其他可能引用的页面）============ */
.player-card { position: relative; }
.pc-online-dot {
  position: absolute; top: 12px; right: 12px;
  width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid var(--navy-900);
  background: var(--text-mute);
  z-index: 2;
  transition: all .25s var(--ease);
}
.pc-online-dot.online { background: #4ade80; box-shadow: 0 0 10px rgba(74,222,128,.6); }
.pc-online-dot.recent { background: #fbbf24; box-shadow: 0 0 8px rgba(251,191,36,.5); }
.pc-online-dot.offline { background: #5e6e8c; }
.pc-online-dot[data-status="online"]::after {
  content: ''; position: absolute; inset: -4px; border-radius: 50%;
  border: 2px solid #4ade80; opacity: 0;
  animation: pulseOnline 2s ease-out infinite;
}
@keyframes pulseOnline {
  0% { transform: scale(.85); opacity: .8; }
  100% { transform: scale(1.6); opacity: 0; }
}
.pc-tl-stack {
  position: absolute; top: 12px; left: 12px;
  display: flex; flex-direction: column; align-items: flex-start;
  gap: 4px;
  z-index: 2;
}
.pc-points-chip,
.pc-hr-chip {
  font-family: var(--font-display);
  font-weight: 600;
  border-radius: 999px;
  letter-spacing: .04em;
  backdrop-filter: blur(6px);
  white-space: nowrap;
  line-height: 1.15;
}

/* 全垒打 — Hero badge（最显眼那颗） */
.pc-hr-chip {
  font-size: 14px;
  font-weight: 700;
  padding: 5px 12px 4px;
  background: linear-gradient(135deg, rgba(255,150,30,.38), rgba(228,199,122,.16));
  border: 1px solid rgba(255,190,90,.6);
  color: #ffe28a;
  letter-spacing: .06em;
  box-shadow:
    0 2px 8px rgba(255,170,50,.2),
    0 0 16px rgba(255,180,80,.35),
    inset 0 1px 0 rgba(255,255,255,.1);
  animation: hrPulse 2.6s ease-in-out infinite;
}
.pc-hr-chip .hr-bolt {
  margin-right: 5px; font-size: 14px;
  display: inline-block; transform: translateY(-1px);
  filter: drop-shadow(0 0 4px rgba(255,200,100,.7));
}
.pc-hr-chip .hr-label {
  font-size: 10px; opacity: .8; margin-left: 3px;
  letter-spacing: .14em; font-weight: 600;
}
@keyframes hrPulse {
  0%, 100% { box-shadow: 0 2px 8px rgba(255,170,50,.2), 0 0 16px rgba(255,180,80,.35), inset 0 1px 0 rgba(255,255,255,.1); }
  50%      { box-shadow: 0 2px 8px rgba(255,170,50,.3), 0 0 24px rgba(255,180,80,.6),  inset 0 1px 0 rgba(255,255,255,.14); }
}

/* 积分 — 次级信息，比 HR 收一档 */
.pc-points-chip {
  font-size: 11.5px;
  padding: 2.5px 9px;
  background: linear-gradient(135deg, rgba(201,169,97,.16), rgba(228,199,122,.06));
  border: 1px solid rgba(228,199,122,.32);
  color: var(--gold-bright);
}
.pc-points-chip .pts-label {
  font-size: 9.5px; opacity: .68;
  margin-left: 2px; letter-spacing: .1em;
}

/* 正式 — 已移到 meta 行做小字后缀（避免 3 chip 拥挤）；样式留给其它页面（dashboard 等）继续用 */
.pc-verified-chip {
  font-family: var(--font-display); font-weight: 600; border-radius: 999px;
  letter-spacing: .04em; backdrop-filter: blur(6px); white-space: nowrap;
  font-size: 11px; padding: 3px 9px; line-height: 1.2;
  background: linear-gradient(135deg, rgba(46,107,255,.22), rgba(91,139,255,.08));
  border: 1px solid rgba(46,107,255,.4);
  color: var(--blue-300);
}
.pc-verified-chip .vc-mark { color: var(--gold-bright); margin-right: 3px; }

/* 球员卡 meta 行尾的 "✓ 正式" 后缀（轻量） */
.pc-meta .pc-verified-inline {
  color: var(--blue-300);
  font-size: 11px;
  letter-spacing: .04em;
  opacity: .85;
  white-space: nowrap;
}
.pc-meta .pc-verified-inline .vi-mark {
  color: var(--gold-bright);
  margin-right: 2px;
}
.pc-points-chip {
  background: linear-gradient(135deg, rgba(201,169,97,.18), rgba(228,199,122,.08));
  border: 1px solid rgba(228,199,122,.35);
  color: var(--gold-bright);
}
.pc-points-chip .pts-label { font-size: 10px; opacity: .7; margin-left: 2px; }
.pc-verified-chip {
  background: linear-gradient(135deg, rgba(46,107,255,.22), rgba(91,139,255,.08));
  border: 1px solid rgba(46,107,255,.4);
  color: var(--blue-300);
  font-size: 11px;
}
.pc-verified-chip .vc-mark { color: var(--gold-bright); margin-right: 3px; }

/* 试训区 ----------------------------------------------------------- */
.tryout-section {
  background: linear-gradient(180deg, rgba(46,107,255,.06), rgba(46,107,255,.02));
  border: 1px solid rgba(46,107,255,.2);
  border-radius: var(--r-lg);
  padding: 24px 24px 20px;
  margin-bottom: 32px;
}
.tryout-head {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 14px; flex-wrap: wrap;
}
.tryout-icon {
  font-size: 24px; line-height: 1;
}
.tryout-title {
  font-family: var(--font-display); font-size: 22px;
  color: var(--blue-300); margin: 0;
}
.tryout-sub {
  color: var(--text-dim); font-size: 13px; flex: 1; min-width: 200px;
}
.tryout-count {
  background: rgba(46,107,255,.15);
  border: 1px solid rgba(46,107,255,.3);
  padding: 3px 12px; border-radius: 999px;
  color: var(--blue-300); font-size: 12px;
}
.tryout-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 12px;
}
.tryout-card {
  background: rgba(255,255,255,.02);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 14px;
  text-align: center;
  transition: transform .2s var(--ease), border-color .2s ease;
  text-decoration: none; color: inherit;
  display: block;
}
.tryout-card:hover {
  transform: translateY(-3px);
  border-color: rgba(46,107,255,.4);
}
.tryout-card .tc-photo {
  width: 56px; height: 56px; border-radius: 50%;
  object-fit: cover; margin: 0 auto 8px;
  border: 2px solid var(--line-strong);
  display: block;
}
.tryout-card .tc-name {
  color: var(--text); font-size: 14px; font-weight: 500;
  margin-bottom: 6px;
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
.tryout-card .tc-progress-wrap {
  background: rgba(255,255,255,.05);
  height: 6px; border-radius: 3px;
  overflow: hidden;
  margin: 6px 0 4px;
}
.tryout-card .tc-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--blue-500), var(--blue-400));
  border-radius: 3px;
  transition: width .4s var(--ease);
}
.tryout-card .tc-progress-label {
  font-size: 11px; color: var(--text-dim);
  font-family: var(--font-display);
}
.tryout-card .tc-points {
  color: var(--gold-bright); font-family: var(--font-display);
  font-size: 12px; margin-top: 4px;
}
.tryout-card .tc-online-dot {
  display: inline-block; width: 7px; height: 7px;
  border-radius: 50%; background: var(--text-mute);
  vertical-align: middle;
}
.tryout-card .tc-online-dot.online { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,.6); }
.tryout-card .tc-online-dot.recent { background: #fbbf24; }

/* ============ Starfield Roster Stage · 呼吸星空球员墙 ============ */
.roster-experience {
  position: relative;
  min-height: calc(100vh - 73px);
}
.roster-arm-wrap {
  position: relative;
  width: 100vw;
  margin-left: calc(50% - 50vw);
  margin-right: calc(50% - 50vw);
}
.orion-arm-stage {
  --arm-gold: rgba(228,199,122,.92);
  --arm-blue: rgba(91,139,255,.92);
  --arm-emerald: rgba(110,231,183,.82);
  --arm-float-duration: 12.8s;
  --arm-breathe-duration: 10.8s;
  --arm-path-duration: 13.6s;
  --arm-path-step: .18s;
  --arm-sway-x: .8px;
  --arm-sway-y: 1.6px;
  --arm-breathe-min: .992;
  --arm-breathe-max: 1.018;
  position: relative;
  min-height: max(760px, calc(100vh - 73px));
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 30% 18%, rgba(91,139,255,.16), transparent 36%),
    radial-gradient(ellipse at 74% 62%, rgba(228,199,122,.10), transparent 32%),
    linear-gradient(180deg, rgba(5,11,24,.18), rgba(5,11,24,.82) 84%),
    url('assets/img/backgrounds/orion-deep-space-panorama.png') center 38% / cover no-repeat;
}
.orion-arm-stage::before,
.orion-arm-stage::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
}
.orion-arm-stage::before {
  background:
    radial-gradient(ellipse at 50% 44%, transparent 0 28%, rgba(5,11,24,.18) 54%, rgba(5,11,24,.72) 100%),
    linear-gradient(90deg, rgba(5,11,24,.72), transparent 16% 84%, rgba(5,11,24,.72));
}
.orion-arm-stage::after {
  background:
    linear-gradient(180deg, rgba(5,11,24,.82), transparent 14% 72%, rgba(5,11,24,.92)),
    radial-gradient(circle at 50% 48%, rgba(255,255,255,.05), transparent 22%);
  mix-blend-mode: screen;
  opacity: .72;
}
.orion-arm-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  display: block;
}
.orion-arm-stage.no-webgl .orion-arm-canvas { display: none; }
.orion-arm-stage[data-particle-mode="css"] .orion-arm-canvas,
.orion-arm-stage[data-particle-mode="off"] .orion-arm-canvas,
.orion-arm-stage[data-particle-mode="webgl"] .arm-particle-field,
.orion-arm-stage[data-particle-mode="off"] .arm-particle-field {
  display: none;
}
.arm-particle-field {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  overflow: hidden;
  contain: layout paint style;
  mix-blend-mode: screen;
}
.arm-particle-dot {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--dot-size, 2px);
  height: var(--dot-size, 2px);
  border-radius: 999px;
  background:
    radial-gradient(circle, rgba(255,255,255,.98) 0 18%, rgba(146,190,255,.82) 38%, rgba(46,107,255,.18) 72%, transparent 100%);
  box-shadow: 0 0 var(--dot-glow, 10px) rgba(116,162,255,.7);
  opacity: var(--dot-alpha, .58);
  will-change: transform, opacity;
}
.orion-arm-stage:not(.is-css-particle-active) .arm-particle-dot {
  will-change: auto;
}
.arm-particle-dot.is-gold {
  background:
    radial-gradient(circle, rgba(255,244,195,.98) 0 18%, rgba(228,199,122,.78) 44%, rgba(201,169,97,.18) 74%, transparent 100%);
  box-shadow: 0 0 var(--dot-glow, 12px) rgba(228,199,122,.62);
}
.arm-particle-dot.is-mist {
  filter: blur(.2px);
  opacity: var(--dot-alpha, .36);
}
.arm-node-layer {
  position: absolute;
  inset: 0;
  z-index: 4;
  perspective: 1100px;
  transform-style: preserve-3d;
  contain: layout paint style;
}
.orion-arm-stage[data-density="dense"] .arm-node-name {
  opacity: .54;
}
.orion-arm-stage[data-density="overflow"] .arm-node-name {
  opacity: 0;
  transform: translate(-50%, -2px) scale(.92);
}
.orion-arm-stage[data-density="overflow"] .arm-node:hover .arm-node-name,
.orion-arm-stage[data-density="overflow"] .arm-node:focus-visible .arm-node-name,
.orion-arm-stage[data-density="overflow"] .arm-node.is-focused .arm-node-name {
  opacity: 1;
  transform: translate(-50%, 0) scale(1);
}
.arm-stage-controls {
  position: absolute;
  z-index: 7;
  top: clamp(22px, 4vh, 44px);
  left: 50%;
  width: min(720px, calc(100vw - 44px));
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.orion-arm-stage.has-arm-admin-panel .arm-stage-controls {
  left: max(22px, calc((100vw - 720px) / 2));
  width: min(720px, calc(100vw - 148px));
  transform: none;
}
.arm-title-script {
  font-family: "OrionQijiTitle", "Noto Serif SC", "STSong", serif;
  font-size: clamp(38px, 6vw, 84px);
  font-weight: 400;
  line-height: .95;
  color: rgba(248,241,215,.96);
  text-align: center;
  letter-spacing: 0;
  text-shadow:

body.arm-card-open {

.arm-card-modal {

  --origin-y: 50vh;
  --origin-dx: 0px;
  --origin-dy: 0px;
  position: fixed;
  inset: 0;
  z-index: 90;
  display: grid;
  place-items: center;
  padding: clamp(74px, 9vh, 104px) 20px 28px;
  pointer-events: none;
  opacity: 0;
  transition: opacity .32s var(--ease);
}
.arm-card-modal::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at var(--origin-x) var(--origin-y), rgba(111,166,255,.30), transparent 19%),
    radial-gradient(circle at 50% 46%, rgba(228,199,122,.12), transparent 34%),
    rgba(1, 5, 14, .76);
  -webkit-backdrop-filter: blur(6px) saturate(85%);
  backdrop-filter: blur(6px) saturate(85%);
}
.arm-card-modal.is-open {
  pointer-events: auto;
  opacity: 1;
}
.arm-card-backdrop {
  position: absolute;
  inset: 0;
  border: 0;
  padding: 0;
  background: transparent;
  cursor: pointer;
}
.arm-card-dialog {
  position: relative;
  z-index: 1;
  width: min(352px, calc(100vw - 36px));
  max-height: min(720px, calc(100vh - 112px));
  display: grid;
  place-items: center;
  perspective: 1400px;
  opacity: 0;
  transform:
    translate3d(var(--origin-dx), var(--origin-dy), 0)
    scale(.34)
    rotateX(18deg)
    rotateY(-10deg);
  filter: blur(8px);
  transition:
    opacity .42s var(--ease),
    transform .52s cubic-bezier(.16, 1, .3, 1),
    filter .42s var(--ease);
}
.arm-card-modal.is-open .arm-card-dialog {
  opacity: 1;
  transform: translate3d(0, 0, 0) scale(1) rotateX(0deg) rotateY(0deg);
  filter: blur(0);
}
.arm-card-dialog::before {

  inset: 5% -18% -5%;

  background: radial-gradient(circle, rgba(111,166,255,.20), transparent 62%);

<script>
(async () => {
await window.dbReady();
const isWallpaperMode = document.documentElement.classList.contains('wallpaper-mode')
  || new URLSearchParams(window.location.search).get('wallpaper') === '1';
if (isWallpaperMode) {
  document.documentElement.classList.add('wallpaper-mode');
  document.body.classList.add('wallpaper-mode');
  document.title = '猎户群星动态壁纸 · 北京猎户座';
  document.querySelector('meta[name="viewport"]')?.setAttribute('content', 'width=device-width,initial-scale=1,viewport-fit=cover');
} else {
  buildNav('players');
}
// 主球员墙只显示 verified（正式）；casual（试训）走顶部独立 section
const allPlayers = DB.allPlayers();
const players = allPlayers.filter(p => DB.getPlayerLevel(p) === 'verified');
const tryoutPlayers = allPlayers.filter(p => DB.getPlayerLevel(p) === 'casual');
const allGames = DB.allGames();
const allGamesWithAggregate = DB.allGames({includeAggregate:true});
const gameById = new Map(allGames.map(g => [g.id, g]));
const totalGamesCount = allGames.length;
const playerCategoryCache = new Map();
const playerStatsCache = new Map();
const playerPointsCache = new Map();
const playerRuntimeCache = new Map();

function playerPublicIdentity(p) {
  return DB.publicPlayerIdentityForViewer ? DB.publicPlayerIdentityForViewer(p) : (DB.publicPlayerIdentity ? DB.publicPlayerIdentity(p, { reveal: DB.canViewRealPlayerIdentity && DB.canViewRealPlayerIdentity(p) }) : {
    name: p?.name || '',
    avatar: DB.playerPhotoUrl(p),
    maskedName: p?.name || '',
    accessibleName: p?.name || '',
    photoAlt: p?.name || '',
  });
}

function identityClass(identity) {
  return identity?.isFrosted ? ' is-identity-frosted' : '';
}

function identityAvatarWrapClass(identity) {
  return identity?.isFrostedAvatar ? ' is-frosted-avatar' : '';
}

function identityAvatarClass(identity) {
  return identity?.isFrostedAvatar ? ' identity-frosted-avatar' : '';
}

function identityNameClass(identity) {
  return identity?.isFrostedName ? ' identity-frosted-name' : '';
}

function identityHiddenAttr(identity) {
  return identity?.isFrostedName ? ' aria-hidden="true"' : '';
}

function playerDashboardHref(p) {
  return `dashboard.html?id=${encodeURIComponent(p.id)}`;
}

// Classify a single position string into one of: 内野/外野/投手/捕手/其他
// 注意 ① 用 /i 标志 case-insensitive，覆盖 SEED 用大写 "CF" 跟比赛数据用小写 "cf" 两种风格
//      ② 单字母 C/P 必须 \b 单词边界，避免 "CF"/"3B" 里的字母被误中
function classifyPos(pos){
  if (!pos) return null;
  if (/外野|LF|CF|RF|SF|OF/i.test(pos)) return '外野';
  if (/投手|\bP\b/i.test(pos)) return '投手';
  if (/捕手|\bC\b/i.test(pos)) return '捕手';
  if (/一垒|二垒|三垒|游击|内野|1B|2B|3B|SS/i.test(pos)) return '内野';
  return '其他';
}

// 注册位置（admin 维护）转出的类别——可能多个（"中外野 CF · 投手 P" → 外野 + 投手）
function registeredCategories(p){
  const cats = new Set();
  for (const part of String(p.position||'').split(/[^\w一-鿿]+/).filter(Boolean)) {
    const c = classifyPos(part); if (c) cats.add(c);
  }
  return cats;
}

// 实战出场位置（来自 g.batting[i].pos）转出的类别。
// GameChanger 用 "cf-p" / "lf-p" 这种"位置切换"语义（中外野→投手 / 左外野→投手），
// 表示同场切了 2 个位置——按非字母数字字符拆分，两边都算
function gameplayCategories(p){
  const cats = new Set();
  const myKey = DB.canonicalNameKey(p.name);
  for (const g of allGamesWithAggregate) {
    for (const b of (g.batting||[])) {
      if (DB.playerCanonicalKey(b.name) !== myKey) continue;
      for (const part of String(b.pos||'').split(/[^\w一-鿿]+/).filter(Boolean)) {
        const c = classifyPos(part); if (c) cats.add(c);
      }
    }
  }
  return cats;
}

// 一个球员的所有位置类别 = 注册类别 ∪ 实战类别。
// 两类来源都重要：
//   ① 注册位置（admin 维护的"主位"）—— 球员个人意愿/教练安排
//   ② 实战位置（g.batting[i].pos）—— 数据驱动，"他实际打过这个位置"
// 二者 union：versatility 球员会出现在多个 tag；SEED 挂错也会被实战补上 ✓
function playerCategories(p){
  if (playerCategoryCache.has(p.id)) return playerCategoryCache.get(p.id);
  const cats = new Set();
  for (const c of registeredCategories(p)) cats.add(c);
  for (const c of gameplayCategories(p)) cats.add(c);
  playerCategoryCache.set(p.id, cats);
  return cats;
}

// Build the union of categories that any player is in
const positionCats = (() => {
  const set = new Set();
  players.forEach(p => {
    for (const c of playerCategories(p)) set.add(c);
  });
  return ['全部', '内野', '投手', '外野', '捕手', '其他'].filter(c => c === '全部' || set.has(c));
})();

// Render position chips
const posHost = document.getElementById('posChips');
posHost.innerHTML = positionCats.map((c,i)=>`<button class="pos-chip ${i===0?'active':''}" data-pos="${c}">${c}</button>`).join('');

let activeFilter = { pos: '全部', search: '' };

const armStage = document.getElementById('playersGrid');
const armCanvas = document.getElementById('orionArmCanvas');
const armParticleField = document.getElementById('armParticleField');
const armNodeLayer = document.getElementById('armNodeLayer');
const armFocusPanel = document.getElementById('armFocusPanel');
const armCardModal = document.getElementById('armCardModal');
const armCardMount = document.getElementById('armCardMount');
const armCountLabel = document.getElementById('armCountLabel');
const armModeLabel = document.getElementById('armModeLabel');
const armMotionToggle = document.getElementById('armMotionToggle');
const armAdminPanel = document.getElementById('armAdminPanel');
const armAdminToggle = document.getElementById('armAdminToggle');
const armAdminShell = document.getElementById('armAdminShell');
const armPresetTemplates = document.getElementById('armPresetTemplates');
const armCustomTemplates = document.getElementById('armCustomTemplates');
const armTemplateName = document.getElementById('armTemplateName');
const armGlobalStatus = document.getElementById('armGlobalStatus');
const armGlobalPublish = document.getElementById('armGlobalPublish');
const armParticleStatus = document.getElementById('armParticleStatus');
const armReducedMotion = !isWallpaperMode && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const ARM_LOW_MOTION_KEY = 'orion.players.lowMotion.v1';
function loadArmLowMotionPreference() {
  try {
    return window.localStorage?.getItem(ARM_LOW_MOTION_KEY) === '1';
  } catch (_) {
    return false;
  }
}
function saveArmLowMotionPreference(enabled) {
  try {
    if (enabled) window.localStorage?.setItem(ARM_LOW_MOTION_KEY, '1');
    else window.localStorage?.removeItem(ARM_LOW_MOTION_KEY);
  } catch (_) {}
}
const armStoredLowMotion = isWallpaperMode ? false : loadArmLowMotionPreference();
const currentUser = DB.currentUser();
const isAdminUser = !!(currentUser && DB.hasPermission && DB.hasPermission('system:settings'));
const armState = {
  filtered: [],
  focusedId: null,
  lockedFocus: false,
  phase: 0,
  lastTs: 0,
  lastPaintTs: 0,
  frameId: 0,
  frameTimer: 0,
  lowMotion: !!armReducedMotion || armStoredLowMotion,
  paused: !!armReducedMotion || armStoredLowMotion,
  pageHidden: false,
  stageVisible: true,
  perfPaused: false,
  pointerX: 0,
  pointerY: 0,
  three: null,
  renderer: null,
  scene: null,
  camera: null,
  armGroup: null,
  dust: null,
  stars: null,
  hoverId: null,
  totalGames: 0,
  tryoutCount: 0,
  stageObserver: null,
  stageRect: null,
  stageRectDirty: true,
  resizeObserver: null,
  sceneLoading: false,
  sceneInitQueued: false,
  staticRendered: false,
  nodesDirty: true,
  pointerRaf: 0,
  pointerClientX: 0,
  pointerClientY: 0,
  pointerActive: false,
  nodeEls: [],
  layoutKey: '',
  layoutPoints: [],
  pathAssignmentKey: '',
  appliedSettingsSignature: '',
  appliedLayoutSignature: '',
  stageSizeW: 0,
  stageSizeH: 0,
  stageSizeDirty: true,
  particleMode: 'auto',
  particleActualMode: 'pending',
  particleLastError: '',
  particleDensity: 1,
  particleBrightness: 1,
  particleRadius: 1,
  particleStrength: 1,
  particleReturn: 1,
  dustBasePositions: null,
  starBasePositions: null,
  cssParticles: [],
  cssParticleStageW: 0,
  cssParticleStageH: 0,
  cssParticleVisibleCount: 0,
  cssParticleSettling: false,
  webglParticlesSettling: false,
  particleRenderKey: '',
  particleRenderParams: null,
  particleMaterialBrightness: 0,
};

function shouldUseStaticArmScene() {
  const particleMode = armState.particleMode || 'auto';
  const compactPointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if (armReducedMotion || armState.lowMotion) return true;
  if (particleMode === 'off' || particleMode === 'css') return true;
  if (particleMode === 'webgl') return false;
  return compactPointer && window.innerWidth < 760;
}

function markArmStageSizeDirty() {
  armState.stageSizeDirty = true;
  armState.stageRectDirty = true;
  armState.particleRenderKey = '';
}

function markArmStagePositionDirty() {
  armState.stageRectDirty = true;
}

function getArmStageClientRect() {
  if (!armState.stageRectDirty && armState.stageRect) return armState.stageRect;
  const rect = armStage.getBoundingClientRect();
  armState.stageRect = {
    left: rect.left,
    top: rect.top,
    width: rect.width,
    height: rect.height,
  };
  armState.stageRectDirty = false;
  return armState.stageRect;
}

function getArmStageSize() {
  if (!armState.stageSizeDirty && armState.stageSizeW > 0 && armState.stageSizeH > 0) {
    return { width: armState.stageSizeW, height: armState.stageSizeH };
  }
  const rect = getArmStageClientRect();
  armState.stageSizeW = Math.max(1, rect.width || window.innerWidth);
  armState.stageSizeH = Math.max(1, rect.height || 760);
  armState.stageSizeDirty = false;
  return { width: armState.stageSizeW, height: armState.stageSizeH };
}

function syncArmCssParticleClass(active = false) {
  armStage.classList.toggle('is-css-particle-active', !!active);
}

function syncArmPerfPauseState() {
  const perfPaused = !isWallpaperMode && (armState.pageHidden || !armState.stageVisible);
  if (armState.perfPaused !== perfPaused) {
    armState.perfPaused = perfPaused;
    armStage.classList.toggle('is-perf-paused', perfPaused);
  }
  return perfPaused;
}

function stopArmAnimation() {
  if (armState.frameId) cancelAnimationFrame(armState.frameId);
  if (armState.frameTimer) window.clearTimeout(armState.frameTimer);
  armState.frameId = 0;
  armState.frameTimer = 0;
  armState.lastTs = 0;
  syncArmCssParticleClass(false);
}

function wakeArmAnimation() {
  if (armState.frameTimer) {
    window.clearTimeout(armState.frameTimer);
    armState.frameTimer = 0;
  }
  if (syncArmPerfPauseState()) return;
  startArmAnimation();
}

function disposeArmMaterial(material) {
  if (!material) return;
  if (Array.isArray(material)) material.forEach(disposeArmMaterial);
  else material.dispose?.();
}

function disposeArmScene() {
  if (armState.resizeObserver) {
    armState.resizeObserver.disconnect();
    armState.resizeObserver = null;
  }
  window.removeEventListener('resize', resizeArmScene);
  if (armState.scene) {
    armState.scene.traverse(obj => {
      obj.geometry?.dispose?.();
      disposeArmMaterial(obj.material);
    });
  }
  if (armState.renderer) {
    armState.renderer.clear?.();
    armState.renderer.dispose?.();
  }
  if (armCanvas) armCanvas.width = armCanvas.width;
  Object.assign(armState, {
    three: null,
    renderer: null,
    scene: null,

function clamp(n, min, max) {
  return Math.max(min, Math.min(max, n));
}

function clampSettingNumber(value, fallback, min, max) {
  const n = Number(value);
  return Number.isFinite(n) ? clamp(n, min, max) : fallback;
}

function normalizeArmYear(value) {
  return String(value || ARM_ADMIN_DEFAULTS.year).replace(/[^\d]/g, '').slice(0, 6) || ARM_ADMIN_DEFAULTS.year;
}

function normalizeArmAdminSettings(raw = {}) {
  const next = { ...ARM_ADMIN_DEFAULTS, ...(raw || {}) };
  if (!ARM_FORMATION_LABELS[next.formation]) next.formation = ARM_ADMIN_DEFAULTS.formation;
  if (!ARM_PATH_LABELS[next.path]) next.path = ARM_ADMIN_DEFAULTS.path;
  if (!ARM_PARTICLE_MODE_LABELS[next.particleMode]) next.particleMode = ARM_ADMIN_DEFAULTS.particleMode;
  next.year = normalizeArmYear(next.year);
  next.yearLimit = Math.round(clampSettingNumber(next.yearLimit, ARM_ADMIN_DEFAULTS.yearLimit, 24, 160));
  next.particleDensity = clampSettingNumber(next.particleDensity, ARM_ADMIN_DEFAULTS.particleDensity, .35, 1.8);
  next.particleBrightness = clampSettingNumber(next.particleBrightness, ARM_ADMIN_DEFAULTS.particleBrightness, .35, 1.8);
  next.particleRadius = clampSettingNumber(next.particleRadius, ARM_ADMIN_DEFAULTS.particleRadius, .55, 1.8);
  next.particleStrength = clampSettingNumber(next.particleStrength, ARM_ADMIN_DEFAULTS.particleStrength, .4, 2.2);
  next.particleReturn = clampSettingNumber(next.particleReturn, ARM_ADMIN_DEFAULTS.particleReturn, .35, 2.5);
  next.pathDuration = clampSettingNumber(next.pathDuration, ARM_ADMIN_DEFAULTS.pathDuration, 5.6, 24);
  next.breatheDuration = clampSettingNumber(next.breatheDuration, ARM_ADMIN_DEFAULTS.breatheDuration, 5.8, 18);
  next.sway = clampSettingNumber(next.sway, ARM_ADMIN_DEFAULTS.sway, .2, 2.6);
  next.spread = clampSettingNumber(next.spread, ARM_ADMIN_DEFAULTS.spread, .82, 1.28);
  next.randomSeed = Math.round(clampSettingNumber(next.randomSeed, ARM_ADMIN_DEFAULTS.randomSeed, 1, 999999));
  return next;
}

function armSettingsSignature(settings) {
  const s = normalizeArmAdminSettings(settings);
  return JSON.stringify({
    formation: s.formation,
    path: s.path,
    year: s.year,
    yearLimit: s.yearLimit,
    particleMode: s.particleMode,
    particleDensity: Number(s.particleDensity.toFixed(2)),
    particleBrightness: Number(s.particleBrightness.toFixed(2)),
    particleRadius: Number(s.particleRadius.toFixed(3)),
    particleStrength: Number(s.particleStrength.toFixed(3)),

    sway: Number(s.sway.toFixed(2)),
    spread: Number(s.spread.toFixed(3)),
    randomSeed: s.randomSeed,
  });
}

function armLayoutSettingsSignature(settings) {

function formatArmGlobalTime(value) {
  if (!value) return '默认配置';
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return '已发布';
  return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function updateArmGlobalStatus(state = 'live', text = '') {

  armGlobalStatus.classList.toggle('is-live', state === 'live' || state === 'saving');
  armGlobalStatus.classList.toggle('is-dirty', state === 'dirty');
  armGlobalStatus.classList.toggle('is-error', state === 'error');
  armGlobalStatus.textContent = text || (
    state === 'saving'
      ? '正在发布到全站...'
      : state === 'dirty'
        ? '星阵已调整，正在自动发布全站...'
        : `全站星阵已同步 · ${formatArmGlobalTime(armGlobalState.updatedAt)}`
  );
  if (armGlobalPublish) {
    armGlobalPublish.classList.toggle('is-saving', state === 'saving');
    armGlobalPublish.disabled = state === 'saving';
  }
}

function updateArmParticleStatus() {
  if (!armParticleStatus) return;
  const requested = armState.particleMode || 'auto';
  const requestedLabel = ARM_PARTICLE_MODE_LABELS[requested] || requested;
  const density = (armState.particleDensity || 1).toFixed(2);
  let mode = armState.particleActualMode || 'pending';
  let text = '';
  if (requested === 'off') {
    mode = 'off';
    text = '星尘状态：已关闭';
  } else if (armReducedMotion) {
    mode = 'blocked';
    text = '星尘状态：系统减动效已开启，星尘暂停';
  } else if (armState.lowMotion) {
    mode = 'blocked';
    text = '星尘状态：本访客已关闭动效，星尘暂停';
  } else if (armState.renderer) {
    mode = 'webgl';
    text = `星尘状态：WebGL 运行中 · 密度 ${density}x`;
  } else if (requested === 'webgl' && armState.particleLastError) {
    mode = 'error';
    text = `星尘状态：WebGL 启动失败 · ${armState.particleLastError}`;
  } else if (requested === 'webgl' && (armState.sceneLoading || armState.sceneInitQueued)) {
    mode = 'webgl';
    text = '星尘状态：WebGL 正在启动';
  } else if (mode === 'css') {
    text = `星尘状态：轻量粒子运行中 · 密度 ${density}x`;
  } else if (requested === 'auto' && shouldUseStaticArmScene()) {
    mode = 'css';
    text = `星尘状态：自动兜底为轻量粒子 · 密度 ${density}x`;
  } else {
    mode = requested === 'webgl' ? 'webgl' : 'pending';
    text = `星尘状态：等待渲染 · 当前模式 ${requestedLabel}`;
  }
  armParticleStatus.dataset.mode = mode;
  armParticleStatus.textContent = text;
}

function setArmParticleActualMode(mode, error = '') {
  const safeError = String(error || '').replace(/\s+/g, ' ').slice(0, 54);
  if (armState.particleActualMode === mode && armState.particleLastError === safeError) return;
  armState.particleActualMode = mode;
  armState.particleLastError = safeError;
  updateArmParticleStatus();
}

async function loadArmGlobalSettings({ apply = false, silent = false, skipIfDirty = false } = {}) {
  if (skipIfDirty && isAdminUser && armGlobalState.dirty) return false;
  try {
    const setting = await DB.getSiteSetting(ARM_GLOBAL_SETTING_KEY);
    if (!setting?.value) return false;
    const next = normalizeArmAdminSettings(setting.value);
    const before = armSettingsSignature(armAdminState);
    armAdminState = next;
    armGlobalState.updatedAt = setting.updatedAt || null;
    armGlobalState.updatedByName = setting.updatedByName || '';
    armGlobalState.lastPublishedSignature = armSettingsSignature(next);
    armGlobalState.dirty = false;
    saveArmAdminSettings();
    if (apply && before !== armGlobalState.lastPublishedSignature) {
      applyArmAdminSettings({ persist: false, rerenderControls: isAdminUser });
    } else if (isAdminUser) {
      updateArmGlobalStatus('live');
    }
    return before !== armGlobalState.lastPublishedSignature;
  } catch (err) {
    console.warn('[orion-arm] failed to load global starfield settings:', err);
    if (!silent && isAdminUser) updateArmGlobalStatus('error', `读取全站配置失败：${err.message || err}`);
    return false;
  }
}

async function publishArmGlobalSettings({ quiet = false } = {}) {
  if (!isAdminUser) return false;
  clearTimeout(armGlobalState.saveTimer);
  armGlobalState.saveTimer = 0;
  if (armGlobalState.saving) return false;
  const settings = normalizeArmAdminSettings(armAdminState);
  const signature = armSettingsSignature(settings);
  armGlobalState.saving = true;
  updateArmGlobalStatus('saving');
  try {
    const setting = await DB.updateSiteSetting(ARM_GLOBAL_SETTING_KEY, settings);
    armGlobalState.updatedAt = setting?.updatedAt || new Date().toISOString();
    armGlobalState.updatedByName = setting?.updatedByName || '';
    armGlobalState.lastPublishedSignature = signature;
    armGlobalState.dirty = false;
    updateArmGlobalStatus('live');
    if (!quiet && window.toast) toast('星阵配置已发布到全站', 'success');
    return true;
  } catch (err) {
    armGlobalState.dirty = true;
    updateArmGlobalStatus('error', `发布失败：${err.message || err}`);
    if (!quiet && window.toast) toast(`星阵发布失败：${err.message || err}`, 'error');
    return false;
  } finally {
    armGlobalState.saving = false;
    if (armSettingsSignature(armAdminState) !== signature) scheduleArmGlobalPublish();
  }
}

function scheduleArmGlobalPublish({ immediate = false } = {}) {
  if (!isAdminUser) return;
  armGlobalState.dirty = true;
  updateArmGlobalStatus('dirty');
  clearTimeout(armGlobalState.saveTimer);
  armGlobalState.saveTimer = window.setTimeout(
    () => publishArmGlobalSettings({ quiet: true }),
    immediate ? 120 : 900
  );
}

function startArmGlobalSettingsPolling() {
  if (armGlobalPollTimer) return;
  armGlobalPollTimer = window.setInterval(() => {
    if (document.hidden) return;
    loadArmGlobalSettings({ apply: true, silent: true, skipIfDirty: true });
  }, ARM_GLOBAL_POLL_MS);
}

function invalidateArmLayout() {
  armState.layoutKey = '';

  markArmStageSizeDirty();

function applyArmAdminSettings({ persist = true, rerenderControls = true } = {}) {
  armAdminState = normalizeArmAdminSettings(armAdminState);
  const previousSettingsSignature = armState.appliedSettingsSignature || '';
  const previousLayoutSignature = armState.appliedLayoutSignature || '';
  const previousParticleMode = armState.particleMode || 'auto';
  const previousParticleDensity = armState.particleDensity || 1;
  const previousParticleSignature = [
    previousParticleDensity,
    armState.particleBrightness || 1,
    armState.particleRadius || 1,
    armState.particleStrength || 1,
    armState.particleReturn || 1,
  ].map(v => Number(v).toFixed(3)).join(':');
  const settingsSignature = armSettingsSignature(armAdminState);
  const layoutSignature = armLayoutSettingsSignature(armAdminState);
  const previousPath = armStage.dataset.path || '';
  const previousSway = Number(armStage.dataset.sway || NaN);
  if (isAdminUser && armAdminState.particleMode === 'webgl' && armState.lowMotion && !armReducedMotion) {
    armState.lowMotion = false;
    armState.paused = false;
    saveArmLowMotionPreference(false);
    syncArmMotionButton();
  }
  const pathStep = clamp(armAdminState.pathDuration / 76, .08, .32);
  const swayX = (.8 * armAdminState.sway).toFixed(2);
  const swayY = (1.6 * armAdminState.sway).toFixed(2);
  const minScale = (1 - .008 * armAdminState.sway).toFixed(3);
  const maxScale = (1 + .018 * armAdminState.sway).toFixed(3);
  armStage.style.setProperty('--arm-path-duration', `${armAdminState.pathDuration.toFixed(2)}s`);
  armStage.style.setProperty('--arm-path-step', `${pathStep.toFixed(3)}s`);
  armStage.style.setProperty('--arm-breathe-duration', `${armAdminState.breatheDuration.toFixed(2)}s`);
  armStage.style.setProperty('--arm-float-duration', `${(armAdminState.breatheDuration * 1.18).toFixed(2)}s`);
  armStage.style.setProperty('--arm-sway-x', `${swayX}px`);
  armStage.style.setProperty('--arm-sway-y', `${swayY}px`);
  armStage.style.setProperty('--arm-breathe-min', minScale);
  armStage.style.setProperty('--arm-breathe-max', maxScale);
  armStage.dataset.formation = armAdminState.formation;
  armStage.dataset.path = armAdminState.path;
  armStage.dataset.particleMode = armAdminState.particleMode;
  armStage.dataset.sway = armAdminState.sway.toFixed(3);
  armState.particleMode = armAdminState.particleMode;
  armState.particleDensity = armAdminState.particleDensity;
  armState.particleBrightness = armAdminState.particleBrightness;
  armState.particleRadius = armAdminState.particleRadius;
  armState.particleStrength = armAdminState.particleStrength;
  armState.particleReturn = armAdminState.particleReturn;
  if (persist) saveArmAdminSettings();
  const layoutChanged = previousLayoutSignature !== layoutSignature;
  const pathChanged = previousPath !== armAdminState.path;
  const swayChanged = !Number.isFinite(previousSway) || Math.abs(previousSway - armAdminState.sway) > .001;
  if (!previousSettingsSignature || layoutChanged) {
    invalidateArmLayout();
  } else if (pathChanged || swayChanged) {
    armState.pathAssignmentKey = '';
    armState.nodesDirty = true;
    armState.staticRendered = false;
  }
  const densityChanged = Math.abs(previousParticleDensity - armState.particleDensity) > .001;
  const particleSignature = [
    armState.particleDensity,
    armState.particleBrightness,
    armState.particleRadius,
    armState.particleStrength,
    armState.particleReturn,
  ].map(v => Number(v).toFixed(3)).join(':');
  const particleParamsChanged = previousParticleSignature !== particleSignature;
  if (previousParticleMode !== armState.particleMode || densityChanged) {
    resetArmParticleField();
    disposeArmScene();
    armState.staticRendered = false;
    if (shouldUseStaticArmScene()) armStage.classList.add('no-webgl');
    else armStage.classList.remove('no-webgl');
    scheduleArmScene();
    wakeArmAnimation();
  } else if (particleParamsChanged) {
    armState.particleRenderKey = '';
    armState.staticRendered = false;
    armState.webglParticlesSettling = true;
    wakeArmAnimation();
  } else {
    updateArmParticleStatus();
  }
  armState.appliedSettingsSignature = settingsSignature;
  armState.appliedLayoutSignature = layoutSignature;
  if (rerenderControls) renderArmAdminControls();
  else updateArmAdminOutputs();
  if (armState.nodesDirty && armState.nodeEls.length) positionArmNodes(performance.now());
}

function armHash01(n) {
  const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453;
  return x - Math.floor(x);
}

function armColorClass(p) {
  return positionClass(p.position);
}

function playerStats(p) {
  if (!playerStatsCache.has(p.id)) playerStatsCache.set(p.id, DB.getPlayerStats(p.name));
  return playerStatsCache.get(p.id);
}

function playerPoints(p) {
  if (!playerPointsCache.has(p.id)) playerPointsCache.set(p.id, DB.getPlayerPoints(p.id));
  return playerPointsCache.get(p.id);
}

function playerRuntime(p) {
  if (!playerRuntimeCache.has(p.id)) {
    const stats = playerStats(p);
    const points = playerPoints(p);
    playerRuntimeCache.set(p.id, {
      stats,
      points,
      totalPoints: points.total || 0,
      online: DB.getPlayerOnlineStatus(p.id),
      photoUrl: DB.playerPhotoUrl(p),
      categories: playerCategories(p),
      posClass: positionClass(p.position),
      verified: DB.getPlayerLevel(p) === 'verified',
    });
  }
  return playerRuntimeCache.get(p.id);
}

function armPlayerSortScore(p) {
  const runtime = playerRuntime(p);
  const pts = runtime.totalPoints;
  const stats = runtime.stats;
  return pts * 6 + (stats.HR || 0) * 18 + (stats.games || 0);
}

function setArmLowMotion(enabled, opts = {}) {
  const next = !!enabled || !!armReducedMotion;
  armState.lowMotion = next;
  armState.paused = next;
  if (opts.persist) saveArmLowMotionPreference(!!enabled && !armReducedMotion);
  syncArmMotionButton();
  armState.pointerX = 0;
  armState.pointerY = 0;
  armState.pointerActive = false;
  armState.staticRendered = false;
  armState.nodesDirty = true;

    else if (key === 'particleMode') out.textContent = ARM_PARTICLE_MODE_LABELS[armAdminState.particleMode] || '';
    else if (key === 'year') out.textContent = normalizeArmYear(armAdminState.year);
    else if (key === 'yearLimit') out.textContent = `${armAdminState.yearLimit}`;
    else if (key === 'spread') out.textContent = armAdminState.spread.toFixed(3);
    else if (key === 'particleDensity') out.textContent = `${armAdminState.particleDensity.toFixed(2)}x`;
    else if (key === 'particleBrightness') out.textContent = `${armAdminState.particleBrightness.toFixed(2)}x`;
    else if (key === 'particleRadius') out.textContent = `${armAdminState.particleRadius.toFixed(2)}x`;
    else if (key === 'particleStrength') out.textContent = `${armAdminState.particleStrength.toFixed(2)}x`;
    else if (key === 'particleReturn') out.textContent = `${armAdminState.particleReturn.toFixed(2)}x`;
    else if (key === 'pathDuration') out.textContent = `${armAdminState.pathDuration.toFixed(2)}s`;
    else if (key === 'breatheDuration') out.textContent = `${armAdminState.breatheDuration.toFixed(2)}s`;

  armCustomTemplates.innerHTML = armCustomTemplateState.map(item => `
    <div class="arm-admin-custom-item">
      <button class="arm-admin-custom-btn" type="button" data-arm-custom="${escapeAttr(item.id)}">${escapeAttr(item.name)}</button>
      <button class="arm-admin-delete" type="button" data-arm-delete-custom="${escapeAttr(item.id)}" aria-label="删除 ${escapeAttr(item.name)}">×</button>
    </div>
  `).join('');
}

function applyArmTemplate(settings, { publish = true } = {}) {
  armAdminState = normalizeArmAdminSettings(settings);
  applyArmAdminSettings();
  if (publish) scheduleArmGlobalPublish({ immediate: true });
}

function randomizeArmAdminSettings() {
  const formations = Object.keys(ARM_FORMATION_LABELS);
  const paths = Object.keys(ARM_PATH_LABELS).filter(p => p !== 'none');
  const particleModes = Object.keys(ARM_PARTICLE_MODE_LABELS).filter(p => p !== 'off');
  const randomYear = String(2024 + Math.floor(Math.random() * 7));
  armAdminState = normalizeArmAdminSettings({
    formation: formations[Math.floor(Math.random() * formations.length)],
    path: paths[Math.floor(Math.random() * paths.length)],
    particleMode: particleModes[Math.floor(Math.random() * particleModes.length)],
    year: randomYear,
    yearLimit: Math.floor(54 + Math.random() * 78),
    particleDensity: Math.round((.5 + Math.random() * 1.1) * 20) / 20,
    particleBrightness: Math.round((.65 + Math.random() * .85) * 20) / 20,
    particleRadius: Math.round((.72 + Math.random() * .74) * 40) / 40,
    particleStrength: Math.round((.72 + Math.random() * 1.08) * 40) / 40,
    particleReturn: Math.round((.55 + Math.random() * 1.45) * 40) / 40,
    pathDuration: Math.round((6.4 + Math.random() * 12.4) * 20) / 20,
    breatheDuration: Math.round((7.2 + Math.random() * 7.8) * 20) / 20,
    sway: Math.round((.45 + Math.random() * 1.75) * 100) / 100,
    spread: Math.round((.88 + Math.random() * .34) * 200) / 200,
    randomSeed: Math.floor(Math.random() * 999999) + 1,
  });
  applyArmAdminSettings();
  scheduleArmGlobalPublish({ immediate: true });
}

function saveCurrentArmTemplate() {
  const name = (armTemplateName?.value || '').trim() || `星阵 ${armCustomTemplateState.length + 1}`;
  const item = {
    id: `custom-${Date.now().toString(36)}-${Math.floor(Math.random() * 999).toString(36)}`,
    name: name.slice(0, 16),
    settings: normalizeArmAdminSettings(armAdminState),
  };
  armCustomTemplateState = [item, ...armCustomTemplateState].slice(0, 12);
  saveArmCustomTemplates();
  if (armTemplateName) armTemplateName.value = '';
  renderArmAdminControls();
  if (window.toast) toast('已保存星阵模板', 'success');
}

function initArmAdminPanel() {
  if (!armAdminPanel) return;
  armStage.classList.toggle('has-arm-admin-panel', !!isAdminUser && !isWallpaperMode);
  applyArmAdminSettings({ persist: false, rerenderControls: false });
  if (isWallpaperMode) return;
  if (!isAdminUser) return;
  armAdminPanel.hidden = false;
  updateArmGlobalStatus('live');
  const syncPanelCollapsedState = () => {
    const collapsed = armAdminPanel.classList.contains('is-collapsed');
    armAdminToggle?.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    if (armAdminShell) {
      armAdminShell.toggleAttribute('inert', collapsed);
      armAdminShell.setAttribute('aria-hidden', collapsed ? 'true' : 'false');
    }
  };
  syncPanelCollapsedState();
  renderArmAdminControls();
  armAdminToggle?.addEventListener('click', () => {
    armAdminPanel.classList.toggle('is-collapsed');
    syncPanelCollapsedState();
  });
  armAdminPanel.addEventListener('input', e => {
    const input = e.target.closest('[data-arm-setting]');
    if (!input) return;
    const key = input.dataset.armSetting;
    armAdminState[key] = input.type === 'range' ? Number(input.value) : input.value;
    applyArmAdminSettings({ rerenderControls: false });
    scheduleArmGlobalPublish();
  });
  armAdminPanel.addEventListener('change', e => {
    const input = e.target.closest('[data-arm-setting]');
    if (!input) return;
    const key = input.dataset.armSetting;
    armAdminState[key] = input.type === 'range' ? Number(input.value) : input.value;
    applyArmAdminSettings({ rerenderControls: true });
    scheduleArmGlobalPublish({ immediate: true });
  });
  armAdminPanel.addEventListener('click', e => {
    const presetBtn = e.target.closest('[data-arm-preset]');
    if (presetBtn) {
      const preset = ARM_PRESETS.find(item => item.id === presetBtn.dataset.armPreset);
      if (preset) applyArmTemplate(preset.settings);
      return;
    }
    const customBtn = e.target.closest('[data-arm-custom]');
    if (customBtn) {
      const item = armCustomTemplateState.find(t => t.id === customBtn.dataset.armCustom);
      if (item) applyArmTemplate(item.settings);
      return;
    }
    const deleteBtn = e.target.closest('[data-arm-delete-custom]');
    if (deleteBtn) {
      armCustomTemplateState = armCustomTemplateState.filter(t => t.id !== deleteBtn.dataset.armDeleteCustom);
      saveArmCustomTemplates();
      renderArmAdminControls();
      return;
    }
    const action = e.target.closest('[data-arm-action]')?.dataset.armAction;
    if (action === 'randomize') randomizeArmAdminSettings();
    if (action === 'publish') publishArmGlobalSettings();
    if (action === 'save-template') saveCurrentArmTemplate();
  });
}

function renderArmNodes(filtered) {
  armNodeLayer.innerHTML = filtered.map((p, i) => {
    const identity = playerPublicIdentity(p);
    const runtime = playerRuntime(p);
    const stats = runtime.stats;
    const points = runtime.totalPoints;

    const nodeA11y = isWallpaperMode
      ? 'tabindex="-1" aria-hidden="true"'
      : `aria-label="${escapeAttr(a11yName)} ${jersey}"`;
    const imageLoading = isWallpaperMode ? 'eager' : 'lazy';
    return `<button class="arm-node ${runtime.posClass} status-${escapeAttr(onlineSt.status || 'offline')}${identityClass(identity)}" type="button" role="listitem"
        data-player-id="${escapeAttr(p.id)}" data-arm-index="${i}"

        <span class="arm-node-photo-wrap${identityAvatarWrapClass(identity)}">
          <span class="arm-node-particles" aria-hidden="true"></span>
          <img class="arm-node-photo${identityAvatarClass(identity)}" src="${escapeAttr(identity.avatar)}" alt="" loading="${imageLoading}" decoding="async" onerror="this.src='${DB.DEFAULT_PUBLIC_PLAYER_AVATAR || 'assets/img/logo.jpg'}'">
          <span class="arm-node-dot ${onlineSt.status}" aria-hidden="true"></span>
        </span>
        <span class="arm-node-name${identityNameClass(identity)}"${identityHiddenAttr(identity)}>${escapeAttr(identity.name)}</span>
        <span class="arm-node-meta"><span>${jersey}</span><span>${metric}</span></span>
