<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>积分榜 · 北京猎户座</title>
<link rel="icon" href="assets/img/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=30">
<script src="assets/js/db.js?v=24"></script>
<style>
/* 顶部 hero */
.rank-hero { padding: 100px 0 36px; text-align: center; }
.rank-hero .eyebrow { color: var(--gold-bright); letter-spacing:.18em; }
.rank-title { font-family: var(--font-display); font-size: 56px; line-height:1.1; margin: 12px 0 8px; }
.rank-sub { color: var(--text-dim); max-width:540px; margin: 0 auto; }

/* 顶部 stats bar */
.rank-stats {
  display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
  gap: 16px; margin: 28px auto 0; max-width: 760px;
}
.rs-item {
  background: linear-gradient(135deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
  border: 1px solid var(--line); border-radius: var(--r-md);
  padding: 16px; text-align:center;
}
.rs-num { font-family: var(--font-display); font-size: 30px; color: var(--gold-bright); }
.rs-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing:.1em; margin-top:4px; }

/* Podium - 领奖台 */
.podium {
  display: grid; grid-template-columns: 1fr 1.15fr 1fr;
  gap: 18px; align-items: end; max-width: 960px; margin: 36px auto 8px;
}
.podium-col { text-align: center; }
.podium-col.col-1 { order: 2; }   /* 1st 居中 */
.podium-col.col-2 { order: 1; }   /* 2nd 左 */
.podium-col.col-3 { order: 3; }   /* 3rd 右 */

.podium-card {
  position: relative;
  isolation: isolate;
  min-height: 354px;
  padding: 18px 18px 16px;
  overflow: hidden;
  border-radius: 8px;
  background:
    radial-gradient(circle at 50% 8%, rgba(80, 141, 255, .26), transparent 34%),
    linear-gradient(145deg, rgba(15, 45, 91, .94), rgba(3, 12, 30, .98) 68%),
    var(--navy-900);
  border: 1px solid rgba(121, 158, 225, .34);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 18px 42px rgba(0,0,0,.34);
  transition: transform .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);
}
.podium-card::before {
  content: '';
  position: absolute;
  inset: 0 0 auto;
  height: 4px;
  background: linear-gradient(90deg, transparent, rgba(228,199,122,.92), rgba(83,136,255,.9), transparent);
  box-shadow: 0 0 18px rgba(228,199,122,.38);
  z-index: -1;
}
.podium-card::after {
  content: '';
  position: absolute;
  inset: 8px;
  border: 1px solid rgba(255,255,255,.055);
  border-radius: 6px;
  pointer-events: none;
}
.podium-card:hover {
  transform: translateY(-6px);
  border-color: rgba(228,199,122,.66);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 24px 56px rgba(0,0,0,.42);
}
.podium-card.rank-1 {
  min-height: 416px;
  background:
    radial-gradient(circle at 50% 9%, rgba(228,199,122,.30), transparent 33%),
    linear-gradient(145deg, rgba(18, 50, 98, .96), rgba(4, 13, 31, .99) 68%),
    var(--navy-900);
  border-color: rgba(228,199,122,.68);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 22px 60px rgba(201,169,97,.20);
}
.podium-card.rank-2 { border-color: rgba(200,210,230,.42); }
.podium-card.rank-3 { border-color: rgba(205,165,140,.42); }

.podium-rank-chip {
  position: absolute;
  top: 14px;
  left: 14px;
  z-index: 2;
  padding: 5px 10px;
  border-radius: 999px;
  border: 1px solid rgba(80,136,255,.56);
  background: rgba(22,59,128,.58);
  color: var(--blue-300);
  font-size: 11px;
  line-height: 1;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.podium-medal {
  position: absolute;
  top: 10px;
  right: 14px;
  z-index: 2;
  width: 66px;
  height: 66px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-family: var(--font-display);
  font-size: 31px;
  line-height: 1;
  background: radial-gradient(circle, rgba(255,255,255,.22) 0 34%, rgba(80,136,255,.12) 55%, transparent 74%);
  filter: drop-shadow(0 10px 16px rgba(0,0,0,.35));
  animation: podiumMedalFloat 3.2s ease-in-out infinite;
}
.podium-card.rank-1 .podium-medal {
  width: 76px;
  height: 76px;
  font-size: 37px;
  background: radial-gradient(circle, rgba(228,199,122,.34) 0 34%, rgba(80,136,255,.15) 55%, transparent 75%);
  filter: drop-shadow(0 0 15px rgba(228,199,122,.42)) drop-shadow(0 12px 18px rgba(0,0,0,.38));
  animation-duration: 2.8s;
}
.podium-card.rank-2 .podium-medal { animation-delay: .18s; }
.podium-card.rank-3 .podium-medal { animation-delay: .36s; }
.podium-link:hover .podium-medal {
  animation-name: podiumMedalFloat, podiumMedalPop;
  animation-duration: 2.8s, .7s;
  animation-timing-function: ease-in-out, cubic-bezier(.2,.8,.2,1);
  animation-iteration-count: infinite, 1;
}
@keyframes podiumMedalFloat {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-5px) rotate(3deg); }
}
@keyframes podiumMedalPop {
  0% { scale: 1; }
  45% { scale: 1.12; }
  100% { scale: 1; }
}

.podium-photo-wrap {
  position: relative;
  width: 132px;
  height: 132px;
  margin: 48px auto 14px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: radial-gradient(circle, rgba(255,255,255,.08), rgba(255,255,255,0) 68%);
}
.podium-photo-clip {
  position: absolute;
  inset: 9px;
  z-index: 1;
  border-radius: 50%;
  overflow: hidden;
  background: rgba(255,255,255,.08);
}
.podium-photo-wrap::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 2;
  border-radius: 50%;
  border: 4px solid rgba(228,199,122,.66);
  box-shadow: 0 0 26px rgba(201,169,97,.24), inset 0 0 0 1px rgba(255,255,255,.15);
  pointer-events: none;
}
.podium-photo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 14%;
  transform: scale(1.08);
  transform-origin: center 14%;
  display:block;
}
.podium-card.rank-1 .podium-photo-wrap {
  width: 158px;
  height: 158px;
  margin-top: 54px;
}
.podium-jersey {
  position: absolute;
  right: 1px;
  bottom: 10px;
  z-index: 3;
  min-width: 42px;
  height: 42px;
  padding: 0 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  border: 2px solid var(--gold-bright);
  background: rgba(7, 18, 40, .95);
  color: var(--gold-bright);
  font-family: var(--font-display);
  font-size: 16px;
  box-shadow: 0 8px 16px rgba(0,0,0,.30);
}

.podium-name {
  font-family: var(--font-display); font-size: 25px;
  margin: 4px 0 3px; color: var(--text);
  text-shadow: 0 2px 10px rgba(0,0,0,.38);
}
.podium-card.rank-1 .podium-name { font-size: 31px; color: var(--gold-bright); }
.podium-pos {
  min-height: 18px;
  color: var(--text-dim);
  font-size: 12px;
  letter-spacing: .08em;
}

.podium-pts {
  font-family: var(--font-display); font-size: 38px;
  color: var(--gold-bright); margin: 12px 0 0;
  line-height: 1;
}
.podium-card.rank-1 .podium-pts { font-size: 54px; }
.podium-kicker {
  margin-top: 4px;
  color: rgba(228,199,122,.82);
  font-size: 11px;
  letter-spacing: .22em;
}

.podium-meta { font-size: 12px; color: var(--text-dim); margin-top: 8px; }
.podium-stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid rgba(228,199,122,.20);
}
.podium-stat {
  min-width: 0;
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 6px;
  padding: 8px 4px;
  background: rgba(255,255,255,.025);
}
.podium-stat-val {
  display: block;
  color: var(--gold-bright);
  font-family: var(--font-display);
  font-size: 18px;
  line-height: 1;
}
.podium-stat-label {
  display: block;
  margin-top: 4px;
  color: var(--text-mute);
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.podium-link { display:block; text-decoration: none; color: inherit; height: 100%; }

/* Full table */
.rank-table-section { margin-top: 32px; }
.rank-table {
  width: 100%; border-collapse: collapse;
  background: rgba(255,255,255,.02);
  border: 1px solid var(--line); border-radius: var(--r-md);
  overflow: hidden;
}
.rank-table th {
  background: linear-gradient(180deg, rgba(228,199,122,.12), rgba(201,169,97,.04));
  color: var(--gold-bright);
  padding: 14px 16px; text-align: left;
  font-weight: 600; font-size: 13px;
  text-transform: uppercase; letter-spacing: .08em;
  border-bottom: 1px solid var(--line);
}
.rank-table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
.rank-table tr { transition: background .15s ease; }
.rank-table tbody tr:hover { background: rgba(46,107,255,.06); cursor: pointer; }
.rank-table .rank-num {
  font-family: var(--font-display); font-size: 18px;
  color: var(--text-dim); width: 60px;
}
.rank-table tr[data-top="1"] .rank-num { color: var(--gold-bright); font-size: 22px; }
.rank-table tr[data-top="2"] .rank-num { color: #d8e0ee; font-size: 20px; }
.rank-table tr[data-top="3"] .rank-num { color: #c79a7a; font-size: 20px; }

.rank-photo-cell { display: flex; align-items: center; gap: 12px; }
.rank-mini-avatar {
  width: 44px;
  height: 44px;
}
.rank-mini-photo {
  width: 44px; height: 44px; border-radius: 50%;
  object-fit: cover; border: 2px solid var(--line-strong);
}
.rank-name-block { line-height: 1.3; }
.rank-name { color: var(--text); font-weight: 500; }
.rank-num-pos { font-size: 11px; color: var(--text-dim); margin-top:2px; }
.rank-pts {
  font-family: var(--font-display); font-size: 22px;
  color: var(--gold-bright); font-weight: 600;
}
.rank-breakdown {
  font-size: 11px; color: var(--text-dim);
  display: flex; gap: 8px; flex-wrap: wrap;
}
.rank-breakdown span::before { content: '· '; opacity: .4; }
.rank-breakdown span:first-child::before { content: ''; }

.rank-online-dot {
  display: inline-block; width: 8px; height: 8px;
  border-radius: 50%; background: var(--text-mute); margin-right: 4px;
  vertical-align: middle;
}
.rank-online-dot.online { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,.6); }
.rank-online-dot.recent { background: #fbbf24; }

.rank-jump {
  font-family: var(--font-display);
  color: var(--blue-400); font-size: 14px;
  opacity: 0; transition: opacity .15s;
}
.rank-table tbody tr:hover .rank-jump { opacity: 1; }

/* Filter bar */
.rank-filter-bar {
  display:flex; gap: 12px; align-items: center;
  margin: 16px 0 12px;
  flex-wrap: wrap;
}
.rank-filter-bar label { color: var(--text-dim); font-size: 13px; }
.rank-filter-bar select {
  background: var(--navy-800); border: 1px solid var(--line-strong); color: var(--text);
  padding: 8px 12px; border-radius: var(--r-sm); font-family: var(--font-body);
  cursor: pointer;
}

@media (max-width: 760px) {
  .podium { grid-template-columns: 1fr; max-width: 380px; }
  .podium-col { order: initial !important; }
  .rank-title { font-size: 40px; }
  .rank-table th:nth-child(4), .rank-table td:nth-child(4) { display: none; } /* 隐藏 breakdown 列 */
}
</style>
</head>
<body>

<nav class="nav"><!-- buildNav('ranking') --></nav>

<section class="rank-hero">
  <div class="container">
    <div class="eyebrow">III · POINTS RANKING</div>
    <h1 class="rank-title">积分榜</h1>
    <p class="rank-sub">出场、赛场表现、赛季奖项与活动签到，按积分公式自动汇总。点击任意球员查看积分明细。</p>
    <div class="rank-stats" id="rankStats"></div>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="container">
    <!-- Filter -->
    <div class="rank-filter-bar">
      <label>赛季：
        <select id="seasonFilter">
          <option value="">全部赛季</option>
        </select>
      </label>
      <label style="margin-left:auto">
        <a href="index.html#points-rules" style="color:var(--blue-400); text-decoration:none">📜 查看积分规则 →</a>
      </label>
    </div>

    <!-- Podium -->
    <div class="podium" id="podium"></div>

    <!-- Full table -->
    <div class="rank-table-section">
      <table class="rank-table">
        <thead>
          <tr>
            <th>排名</th>
            <th>球员</th>
            <th>积分</th>
            <th>构成</th>
            <th>出场</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rankBody"></tbody>
      </table>
      <div id="rankEmpty" class="empty" style="display:none;margin-top:32px">暂无积分记录</div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="footer-brand">B E I J I N G &nbsp; O R I O N</div>
  <div class="footer-meta"><span>© 2026 Beijing Orion Baseball Club</span></div>
</footer>

<script src="assets/js/auth.js?v=20"></script>
<script>
(async () => {
await window.dbReady();
buildNav('ranking');

const allLeaderboard = DB.getPointsLeaderboard();

// 赛季筛选选项
(function fillSeasons(){
  const seasonSet = new Set();
  DB.allTournaments().forEach(t => t.season && seasonSet.add(t.season));
  DB.allGames().forEach(g => g.date && seasonSet.add(g.date.slice(0,4)));
  const sel = document.getElementById('seasonFilter');
  [...seasonSet].sort((a,b)=>b.localeCompare(a)).forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
})();

function getFilteredLB(){
  // 赛季过滤：当前 getPlayerPoints 不接 filter，所以前端按赛季内场次重新算简化版（仅按 game timeline 过滤）
  const season = document.getElementById('seasonFilter').value;
  if (!season) return allLeaderboard;
  // 重算：仅保留 timeline 里 date 在该赛季的项
  return DB.allPlayers().map(p => {
    const pts = DB.getPlayerPoints(p.id);
    const seasonTimeline = pts.timeline.filter(t => (t.date||'').startsWith(season));
    const total = seasonTimeline.reduce((s,t) => s + t.delta, 0);
    return {
      player: p,
      total,
      breakdown: { base:0, performance:0, awards:0, manual:0 },
      gamesCount: seasonTimeline.filter(t => t.source === 'game').length,
    };
  }).filter(r => r.total !== 0).sort((a,b)=>b.total - a.total);
}

function escapeText(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escapeAttr(s){ return escapeText(s); }
function playerIdentity(p){
  return DB.publicPlayerIdentityForViewer ? DB.publicPlayerIdentityForViewer(p) : (DB.publicPlayerIdentity ? DB.publicPlayerIdentity(p, { reveal: DB.canViewRealPlayerIdentity && DB.canViewRealPlayerIdentity(p) }) : { name: p?.name || '', avatar: DB.playerPhotoUrl(p), canExposeName: true });
}
function identityNameHTML(identity, className = ''){
  const cls = `${className} public-identity-name${identity.isFrostedName ? ' identity-frosted-name' : ''}`.trim();
  const hidden = identity.isFrostedName ? ' aria-hidden="true"' : '';
  return `<span class="${escapeAttr(cls)}"${hidden}>${escapeText(identity.name)}</span>`;
}
function identityAvatarWrapClass(identity, base = 'identity-avatar-wrap'){
  return `${base}${identity.isFrostedAvatar ? ' is-frosted-avatar' : ''}`;
}
function identityAvatarClass(identity, base = ''){
  return `${base}${identity.isFrostedAvatar ? ' identity-frosted-avatar' : ''}`.trim();
}

function render(){
  const lb = getFilteredLB();

  // Stats
  const totalPts = lb.reduce((s,r)=>s+r.total,0);
  const rsHost = document.getElementById('rankStats');
  rsHost.innerHTML = `
    <div class="rs-item"><div class="rs-num">${lb.length}</div><div class="rs-label">上榜球员</div></div>
    <div class="rs-item"><div class="rs-num">${totalPts}</div><div class="rs-label">累计积分</div></div>
    <div class="rs-item"><div class="rs-num">${lb[0]?.total||0}</div><div class="rs-label">榜首积分</div></div>
    <div class="rs-item"><div class="rs-num">${DB.allGames().length}</div><div class="rs-label">累计比赛</div></div>
  `;

  // Podium (top 3)
  const podiumHost = document.getElementById('podium');
  const top3 = lb.slice(0,3);
  if (top3.length === 0) {
    podiumHost.innerHTML = '<div class="empty" style="grid-column:1/-1">暂无榜首数据</div>';
  } else {
    const medals = ['🥇','🥈','🥉'];
    podiumHost.innerHTML = top3.map((row, i) => {
      const rank = i + 1;
      const p = row.player;
      const identity = playerIdentity(p);
      const bd = row.breakdown || {base:0,performance:0,awards:0,manual:0};
      const performance = Number(bd.performance || 0);
      const rankLabel = rank === 1 ? 'POINTS LEADER' : `TOP ${rank}`;
      return `<div class="podium-col col-${rank}">
        <a class="podium-link" href="player-points.html?id=${p.id}">
          <div class="podium-card rank-${rank}">
            <div class="podium-rank-chip">${rankLabel}</div>
            <div class="podium-medal" aria-label="第${rank}名">${medals[i]}</div>
            <div class="podium-photo-wrap">
              <div class="${identityAvatarWrapClass(identity, 'podium-photo-clip')}">
                <img class="${identityAvatarClass(identity, 'podium-photo')}" src="${escapeAttr(identity.avatar)}" alt="${escapeAttr(identity.photoAlt || identity.accessibleName || '球员公开头像')}" onerror="this.src='assets/img/logo.jpg'">
              </div>
              <span class="podium-jersey">#${p.number||'--'}</span>
            </div>
            <div class="podium-name">${identityNameHTML(identity)}${DB.getPlayerLevel(p)==='casual' ? ' <span style="font-size:11px;color:var(--blue-300);vertical-align:middle">⏳</span>' : ''}</div>
            <div class="podium-pos">${p.position || '—'}</div>
            <div class="podium-pts">${row.total}</div>
            <div class="podium-kicker">SEASON POINTS</div>
            <div class="podium-meta">${row.gamesCount} 场出战</div>
            <div class="podium-stats">
              <div class="podium-stat"><span class="podium-stat-val">${bd.base || 0}</span><span class="podium-stat-label">出场</span></div>
              <div class="podium-stat"><span class="podium-stat-val">${performance >= 0 ? '+' : ''}${performance}</span><span class="podium-stat-label">表现</span></div>
            </div>
          </div>
        </a>
      </div>`;
    }).join('');
  }

  // Full table
  const tbody = document.getElementById('rankBody');
  document.getElementById('rankEmpty').style.display = lb.length ? 'none' : '';
  tbody.innerHTML = lb.map((row, i) => {
    const rank = i + 1;
    const p = row.player;
    const identity = playerIdentity(p);
    const onlineSt = DB.getPlayerOnlineStatus(p.id);
    const bd = row.breakdown || {base:0,performance:0,awards:0,manual:0};
    const breakdownHTML = (bd.base || bd.performance || bd.awards || bd.manual) ? `
      <div class="rank-breakdown">
        ${bd.base ? `<span>出场 ${bd.base}</span>` : ''}
        ${bd.performance ? `<span>表现 ${bd.performance>=0?'+':''}${bd.performance}</span>` : ''}
        ${bd.awards ? `<span>奖项 ${bd.awards}</span>` : ''}
        ${bd.manual ? `<span>手动 ${bd.manual>=0?'+':''}${bd.manual}</span>` : ''}
      </div>` : '<span style="color:var(--text-mute);font-size:11px">—</span>';
    return `<tr data-top="${rank<=3?rank:''}" onclick="location.href='player-points.html?id=${p.id}'">
      <td class="rank-num">${rank}</td>
      <td>
        <div class="rank-photo-cell">
          <span class="${identityAvatarWrapClass(identity, 'identity-avatar-wrap rank-mini-avatar')}">
            <img class="${identityAvatarClass(identity, 'rank-mini-photo')}" src="${escapeAttr(identity.avatar)}" alt="${escapeAttr(identity.photoAlt || identity.accessibleName || '球员公开头像')}" loading="lazy" onerror="this.src='assets/img/logo.jpg'">
          </span>
          <div class="rank-name-block">
            <div class="rank-name"><span class="rank-online-dot ${onlineSt.status}"></span>${identityNameHTML(identity)}${DB.getPlayerLevel(p)==='casual' ? ' <span style="font-size:10px;color:var(--blue-300);background:rgba(46,107,255,.12);border:1px solid rgba(46,107,255,.3);padding:1px 6px;border-radius:999px;margin-left:4px;vertical-align:middle">⏳ 试训</span>' : ''}</div>
            <div class="rank-num-pos">#${p.number||'--'} · ${p.position || '—'}</div>
          </div>
        </div>
      </td>
      <td><span class="rank-pts">${row.total}</span></td>
      <td>${breakdownHTML}</td>
      <td style="color:var(--text-dim)">${row.gamesCount}</td>
      <td><span class="rank-jump">查看明细 →</span></td>
    </tr>`;
  }).join('');
}

document.getElementById('seasonFilter').addEventListener('change', render);
render();
})();
</script>
</body>
</html>
